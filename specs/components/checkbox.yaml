# Checkbox 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 체크 여부(Radix data-state: unchecked · checked · indeterminate)는 hover · focus · disabled 와
# 곱해지므로 상태가 아니라 축(checked)이다. 상태 매트릭스(checkbox.md)는 unchecked 기준이고,
# 체크 상태마다 달라지는 값은 { checked } 규칙에 있다.
# size 기본값(md)은 defaults 에 두지 않는다 — 두면 상태 매트릭스가 md 크기 값까지 칸으로 그린다.
# md 가 기본이라는 표시는 size 축 설명에 둔다.

name: Checkbox

slots:
  root: control 상자 — 채움 · 외곽선 · 모양, 아이콘 색(currentColor)
  icon: 체크 아이콘(lucide `Check`)
  dash: indeterminate dash
  focusRing: 키보드 포커스 링(focus-visible 한정)

variants:
  size:
    sm: ""
    md: 기본
    lg: ""
  checked: [unchecked, checked, indeterminate]

defaults:
  checked: unchecked

states:
  default: ""
  hovered: ""
  focused: (visible) — 배경 · 외곽선 · 아이콘은 위 상태 유지
  disabled: ""
  error: '(`aria-invalid="true"`)'

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    default:
      root:
        borderWidth: 1px
        radius: $radius-sm
        cursor: pointer
        touchTarget: { value: control 단독, note: "AA ⚠ · AAA ⚠ — **label 포함 hit area 44+ 확보 필수**" }
    focused:
      focusRing:
        width: 2px
        offset: 2px
        color: { value: $color-border-focus, dark: $color-border-focus-light, note: "`ring-2 ring-ring ring-offset-2` — 다크 모드는 자동 alias" }
    disabled:
      root:
        background: $color-surface-input
        borderColor: $color-border-default
        opacity: 0.5
        cursor: not-allowed
    error:
      root:
        borderColor: $color-error
      focusRing:
        width: 2px
        color: { value: $color-error / 30%, note: "2px `--color-error/30` ring" }

  # ── 크기 ──────────────────────────────────────────────
  - when: { size: sm }
    default:
      root: { size: 16px }
      icon: { size: { value: 10px, note: "lucide `Check` `size-2.5` `stroke-3`" } }
      dash: { width: 8px, height: 2px }

  - when: { size: md }
    default:
      root: { size: 18px }
      icon: { size: { value: 12px, note: "lucide `Check` `size-3` `stroke-3`" } }
      dash: { width: 10px, height: 2px }

  - when: { size: lg }
    default:
      root: { size: 20px }
      icon: { size: { value: 14px, note: "lucide `Check` `size-3.5` `stroke-3`" } }
      dash: { width: 12px, height: 2px }

  # ── 체크 상태 ─────────────────────────────────────────
  - when: { checked: unchecked }
    default:
      root:
        background: $color-surface-default
        borderColor: $color-border-strong
        icon: none
    hovered:
      root:
        background: $color-surface-input

  - when: { checked: checked }
    default:
      root:
        background: $color-primary
        borderColor: $color-primary
        foreground: $color-text-on-accent
        icon: Check
    disabled:
      root:
        foreground: { value: $color-text-on-accent, note: "opacity 0.5" }

  - when: { checked: indeterminate }
    default:
      root:
        background: $color-primary
        borderColor: $color-primary
        foreground: $color-text-on-accent
        icon: { value: dash, note: "2px" }

motion:
  "unchecked → checked":
    duration: $motion-duration-fast
    easing: $motion-ease-out
    properties: [background, icon scale, opacity]
    note: "icon scale 0.8→1 · opacity 0→1"
  "checked → unchecked":
    duration: $motion-duration-fast
    easing: $motion-ease-out
    properties: [background, icon scale, opacity]
    note: "icon scale 1→0.8 · opacity 1→0"
  "→ indeterminate":
    duration: $motion-duration-fast
    easing: $motion-ease-out
    properties: [background, dash scale, opacity]
    note: "duration · easing 동일 — dash scale 0.8→1"
