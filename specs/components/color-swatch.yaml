# ColorSwatch 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 선택 여부(inactive · active)는 hover · focus · disabled 와 곱해지므로 상태가 아니라 축(selected)이다.
# 셀 색(--swatch-bg · --swatch-fg)은 호출처 팔레트 literal 이라 여기 없다. radius-tile 도 DESIGN.md
# 토큰이 아니라서 스펙 표기(`var(--radius-tile)`) 그대로 둔다.
# size 기본값(md)은 defaults 에 두지 않는다 — 두면 상태 매트릭스가 check 크기까지 칸으로 그린다.
# md 가 기본이라는 표시는 size 축 설명에 둔다.

name: ColorSwatch

slots:
  container: grid container — radiogroup
  swatch: 셀(RadioGroup.Item) — 팔레트 색 채움 · 테두리 · 모양
  check: check indicator (active)
  focusRing: 키보드 포커스 링

variants:
  size:
    sm: mobile, dense form
    md: desktop, 일반 form (기본)
    lg: 강조 영역, 단독
  selected: [inactive, active]

defaults:
  selected: inactive

states:
  enabled: ""
  hover: Border · Indicator 변화 없음
  focus-visible: Border · Indicator 변화 없음
  disabled: Border · Indicator 변화 없음

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      container:
        gap: $spacing-sm
      swatch:
        width: { value: grid 균등, note: "container/N" }
        height: { value: "aspect-ratio: 1", note: "자동" }
        aspectRatio: { value: "1:1", note: "정사각형" }
        borderWidth: 2px
        radius: { value: "var(--radius-tile)", note: "(= radius-lg 12)" }
        transitionProperty: transform
        transitionDuration: $motion-duration-fast
    hover:
      swatch:
        scale: { value: 1.05, note: "`scale(1.05)`" }
    focus-visible:
      focusRing:
        width: 2px
        offset: 2px
        color: { value: $color-border-focus, note: "`ring-2 ring-ring ring-offset-2` — ring = border-focus(shadcn bridge)" }
    disabled:
      swatch:
        opacity: { value: 0.5, note: "`opacity 0.5 cursor-not-allowed`" }
        cursor: not-allowed

  # ── 크기 — check 아이콘만 갈린다 ──────────────────────
  - when: { size: sm }
    enabled:
      check: { size: 12px }

  - when: { size: md }
    enabled:
      check: { size: 14px }

  - when: { size: lg }
    enabled:
      check: { size: 16px }

  # ── 선택 여부 ─────────────────────────────────────────
  - when: { selected: inactive }
    enabled:
      swatch:
        borderColor: transparent

  - when: { selected: active }
    enabled:
      swatch:
        borderColor: { value: currentColor, note: "`color: var(--swatch-fg)`" }
        indicator: ✓ Check
