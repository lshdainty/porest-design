# Divider 의 수치 원본 — 구조는 SEED Divider(2026-10-03 사용자 결정, 표시 비교 페이지 14 "구분선"). 옛 Separator 를 대신한다.
# 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 내용 사이를 나누는 1px 선 — 같은 묶음 안(들인 선) · 묶음 사이(끝까지 선). 크게 다른 내용 사이는 선이 아니라
# 바탕 층(bg-layer-basement) 위 흰 층(bg-layer-default) 사이 8 간격이다 — "8px Divider 는 없다"(SEED).
# 반복되는 목록 줄 사이는 List 의 줄 사이 선(ListDivider — 같은 값, 필요할 때만)이다.
# 기본은 장식(보조 기술에 숨김) — 이름 있는 구획을 나눌 때만 role="separator".
#
# SEED 와 다른 자리(divider.md 의 "SEED 와 다른 점")
#   - 색은 stroke-neutral-subtle 하나 — SEED 기본 stroke.neutral-muted(투명도 있는 검정 6.3%)와 같은 진하기(흰 바탕 1.15 ≈ 1.15)라
#     새 토큰 없이 둔다. SEED 의 두 번째 색(neutral-subtle 4.7%)은 두지 않는다.
#   - 기본이 장식(div · aria-hidden) — SEED 는 <hr>(읽힘)가 기본이고 장식은 as="div".

name: Divider

slots:
  root: 1px 선 — 바깥 여백이 없다(사이 간격은 쓰는 자리가 정한다)

variants:
  orientation:
    horizontal: 가로 — 세로로 쌓인 내용 사이(기본)
    vertical: 세로 — 가로로 놓인 칸 사이(통계 세 칸 · 버튼 묶음)
  inset:
    full: 끝까지 — 묶음 사이 · 액션 영역 위(기본)
    inset: 양끝 16 들임 — 같은 묶음 안

defaults:
  orientation: horizontal
  inset: full

states:
  enabled: 하나뿐 — 정적(호버 · 포커스 · 비활성이 없다)

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      root:
        thickness: { value: 1px, note: "모든 방향 · 모든 자리 1 — 굵은 선을 두지 않는다" }
        background: { value: $color-stroke-neutral-subtle, note: "흰 바탕 1.15 · 다크 1.30(SEED 기본 neutral-muted 1.15 와 같은 진하기) — 장식이라 3:1 대상이 아니다" }
        margin: { value: 0px, note: "선 위아래 · 좌우 간격은 쓰는 자리가 정한다(들임만 Divider 가 갖는다)" }

  # ── 방향 ──────────────────────────────────────────────
  - when: { orientation: horizontal }
    enabled:
      root:
        width: { value: 100%, note: "부모 폭 — 높이 1" }
  - when: { orientation: vertical }
    enabled:
      root:
        height: { value: 부모 높이, note: "부모가 높이를 정한다(flex 안에서 늘어난다 — 부모 높이가 없으면 선이 0 이 된다). 폭 1" }

  # ── 들임 ──────────────────────────────────────────────
  - when: { orientation: horizontal, inset: inset }
    enabled:
      root:
        marginX: { value: $spacing-x4, note: "양끝 16(SEED inset) — 선 폭은 부모 폭 − 32(100% 에 여백을 더하지 않는다). 화면 여백 24 안의 내용에 맞출 때는 쓰는 자리가 여백을 더한다" }
  - when: { orientation: vertical, inset: inset }
    enabled:
      root:
        marginY: { value: $spacing-x4, note: "위아래 16" }
