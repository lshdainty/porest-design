# Menubar 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# MenubarTrigger(Bar 안)와 MenubarItem(Content 안)은 크기와 상태가 서로 달라 part 축으로 가른다.
# 두 쪽 모두 root 부위(항목 상자)에 값을 두고, 어느 쪽인지는 { part } 규칙이 정한다.
# Bar · Content 와 나머지 부위는 조건 없는 규칙에 있다.
# 상태는 부위마다 따로다 — hover · open 은 Trigger 에만, focus · disabled 는 Item 에만 있다.

name: Menubar

slots:
  root: 메뉴 항목 상자 — part 가 trigger 면 ⓑ MenubarTrigger, item 이면 ⓔ MenubarItem
  bar: ⓐ Bar root — 가로 strip
  content: ⓒ MenubarContent (ⓓ MenubarSubContent 동일)
  checkItem: ⓕ MenubarCheckboxItem · ⓖ MenubarRadioItem
  checkIndicator: ⓕ 의 좌측 `Check` indicator
  radioIndicator: ⓖ 의 좌측 `Circle` indicator
  separator: ⓗ MenubarSeparator
  shortcut: ⓘ MenubarShortcut
  label: ⓙ MenubarLabel

variants:
  part:
    trigger: MenubarTrigger (Bar 안)
    item: MenubarItem (Content 안)

states:
  default: ""
  hover: (focus)
  open: "`data-state=open`"
  focus: (keyboard/mouse)
  disabled: ""

rules:
  # ── Bar · Content · 부속 ───────────────────────────────
  - when: {}
    default:
      bar:
        height: 40px
        gap: { value: $spacing-xs, note: "trigger 사이 — `space-x-[var(--spacing-xs)]`" }
        padding: $spacing-xs
        borderWidth: 1px
        borderStyle: solid
        borderColor: $color-border-default
        radius: $radius-sm
      content:
        minWidth: 192px
        radius: $radius-md
        padding: $spacing-xs
        shadow: $shadow-md
        zIndex: { value: 50, note: "(literal)" }
      checkItem:
        paddingLeft: $spacing-2xl
      checkIndicator:
        size: 16px
      radioIndicator:
        size: 8px
      separator:
        height: 1px
        marginX: { value: $spacing-xs, note: "음수 — `-mx-[var(--spacing-xs)]`" }
        marginY: $spacing-xs
        background: $color-border-default
      shortcut:
        typography: $text-label-sm
        fontWeight: 500
        letterSpacing: { value: wide, note: "`tracking-widest`" }
        foreground: $color-text-tertiary
      label:
        typography: $text-label-sm
        fontWeight: 500
        foreground: $color-text-secondary

  # ── Trigger(Bar 안) ────────────────────────────────────
  - when: { part: trigger }
    default:
      root:
        paddingY: $spacing-sm
        paddingX: $spacing-md
        radius: $radius-xs
        typography: $text-title-sm
        fontWeight: 500
        background: transparent
        foreground: $color-text-primary
    hover:
      root:
        background: $color-surface-input
    open:
      root:
        background: $color-surface-input

  # ── Item(Content 안) ───────────────────────────────────
  - when: { part: item }
    default:
      root:
        paddingY: $spacing-sm
        paddingX: $spacing-md
        radius: $radius-sm
        typography: $text-body-md
        background: transparent
        foreground: $color-text-primary
    focus:
      root:
        background: $color-surface-input
    disabled:
      root:
        opacity: 0.5
        cursor: { value: not-allowed, note: "`cursor-not-allowed`" }

motion:
  "trigger · item":
    duration: $motion-duration-fast
    easing: $motion-ease-out
    properties: [colors]
