# Hover Card 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 단일 size · variant 없음 — 값은 모두 열린 content 의 것이다. 열림 · 닫힘 한살이 표
# (closed · delay-open · open · closed)는 동작과 animate 클래스라 hover-card.md 에 남는다.

name: Hover Card

slots:
  root: ⓐ content — 카드 상자

variants: {}

states: [open]

rules:
  - when: {}
    open:
      root:
        width: 256px
        padding: $spacing-md
        radius: $radius-md
        borderWidth: 1px
        borderStyle: solid
        borderColor: $color-border-default
        background: $color-surface-default
        shadow: { value: $shadow-md, note: inline }
        sideOffset: { value: 4px, note: Radix 기본 }
        # Anatomy 의 content 클래스와 z-index.md(L3 modal-aware floating)는 z-[200] 이다. 값은 고치지 않았다.
        zIndex: 50
