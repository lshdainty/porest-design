# Spinner 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 스피너는 border 로 그린 원이다. track 은 border 색, arc 는 border-top 색만 바꾼 것 —
# 그래서 두께(Stroke)는 borderWidth 로 둔다. 상태는 없다(enabled 하나).

name: Spinner

slots:
  root: 원형 스피너 — 지름 · 두께(border)
  arc: ⓑ 회전하는 호(border-top-color)
  track: ⓐ 원형 베이스 — 회전이 안 보이는 부분(border-color)

variants:
  size:
    sm: inline (텍스트 옆 — "메모 저장 중…")
    md: 카드 안 로딩, 폼 제출 중
    lg: 섹션 로딩, modal 안
    xl: full-page 로딩 (가운데 + 라벨)

defaults:
  size: md

states: [enabled]

rules:
  # ── 색 ────────────────────────────────────────────────
  - when: {}
    enabled:
      arc:
        color: { value: $color-primary, dark: $color-primary-light, note: '다크는 `[data-theme="dark"]` cascade 자동 swap' }
      track:
        color: { value: $color-border-default, dark: $color-border-default-dark }

  # ── 크기 ──────────────────────────────────────────────
  - when: { size: sm }
    enabled:
      root: { size: 16px, borderWidth: 2px }

  - when: { size: md }
    enabled:
      root: { size: 24px, borderWidth: 2px }

  - when: { size: lg }
    enabled:
      root: { size: 32px, borderWidth: 3px }

  - when: { size: xl }
    enabled:
      root: { size: 48px, borderWidth: 4px }

# 회전 · 반복 · 호 길이는 모션 칸에 맞지 않아 note 로 둔다.
motion:
  spin:
    duration: $motion-duration-loop
    easing: $motion-ease-linear
    properties: [transform]
    note: "회전 360deg `transform: rotate(360deg)` · iteration infinite · 곡선 linear — 회전이 일정 속도여야 자연스러움 · arc 길이 270deg (3/4) — 시각 회전 인지에 충분, 360deg 완전 채우면 회전 안 보임"
