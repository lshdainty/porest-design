# Pagination 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 링크 셋(Active · Inactive · Previous/Next)은 hover · focus 와 곱해지므로 link 축이다.
# 상태 표는 링크마다 칸을 따로 두고 같은 값도 칸마다 적었으므로(포커스 링 · 밝기 · 불투명도)
# 여기서도 링크 규칙마다 적는다 — #states.link 가 그 표다.
# Active 의 "+ border" 는 두께 · 색을 적지 않았다. md 규칙 절(1px `border-default`)로 채웠다.

name: Pagination

slots:
  root: 링크 상자 — ⓓ ⓔ PaginationLink · ⓕ ⓖ PaginationPrevious / Next
  content: ⓑ PaginationContent — 항목 줄
  ellipsis: ⓗ PaginationEllipsis
  icon: chevron · ellipsis 아이콘
  focusRing: 키보드 포커스 링

variants:
  link:
    active: Active (`neutralOutline`)
    inactive: Inactive (`ghost`)
    prev-next: Previous/Next (`ghost` · `medium`)

states:
  default: ""
  hover: ""
  focus-visible: ""
  pressed: (active)
  disabled: (마지막 페이지에서 Next 등)

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    default:
      content:
        gap: { value: $spacing-xs, note: "item 사이" }
      ellipsis:
        height: 40px
        width: { value: 40px, note: "Button `medium` · `iconOnly` 와 동일" }
      icon:
        size: { value: 16px, note: "chevron, ellipsis" }

  # ── Active ────────────────────────────────────────────
  - when: { link: active }
    default:
      root:
        height: 40px
        width: { value: 40px, note: "Button `size=\"medium\" layout=\"iconOnly\"`" }
        background: $color-surface-default
        foreground: $color-text-primary
        borderColor: $color-border-default
        borderWidth: { value: 1px, note: "표 칸은 `+ border`" }
        ariaCurrent: { value: page, note: "`aria-current=\"page\"` (semantic) — 시각 변화 없음, semantic만" }
    hover:
      root:
        background: $color-surface-input
    focus-visible:
      focusRing:
        width: 2px
        offset: 2px
        color: { value: $color-border-focus, note: "`ring-2 ring-ring ring-offset-2` — ring = border-focus(shadcn bridge)" }
    pressed:
      root:
        brightness: { value: 95%, note: "`brightness-95` (Button SoT)" }
    disabled:
      root:
        opacity: 0.5
        cursor: { value: not-allowed, note: "`cursor-not-allowed`" }

  # ── Inactive ──────────────────────────────────────────
  - when: { link: inactive }
    default:
      root:
        height: 40px
        width: { value: 40px, note: "Button `size=\"medium\" layout=\"iconOnly\"`" }
        background: transparent
        foreground: $color-text-primary
    hover:
      root:
        background: $color-surface-input
    focus-visible:
      focusRing:
        width: 2px
        offset: 2px
        color: { value: $color-border-focus, note: "`ring-2 ring-ring ring-offset-2`" }
    pressed:
      root:
        brightness: { value: 95%, note: "`brightness-95`" }
    disabled:
      root:
        opacity: 0.5

  # ── Previous / Next ───────────────────────────────────
  - when: { link: prev-next }
    default:
      root:
        height: 40px
        paddingX: { value: 가변, note: "Button `size=\"medium\"` (`h-10 px-x4`)" }
        background: transparent
        foreground: $color-text-primary
    hover:
      root:
        background: $color-surface-input
    focus-visible:
      focusRing:
        width: 2px
        offset: 2px
        color: { value: $color-border-focus, note: "`ring-2 ring-ring ring-offset-2`" }
    pressed:
      root:
        brightness: { value: 95%, note: "`brightness-95`" }
    disabled:
      root:
        opacity: 0.5
