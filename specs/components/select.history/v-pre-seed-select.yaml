# Select 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 상태 표가 부위마다 둘이다 — 트리거(States)와 옵션 한 줄(Item state).
#   트리거   조건 없는 규칙. 상태 표는 #base(부위 · 상태별 목록)로 그린다.
#   크기     { size: md } 규칙(md 하나뿐). #size 로 그린다.
#   옵션     { part: item } 규칙 — part 축은 옵션 규칙을 트리거와 가르는 데만 쓴다.
#            선택 여부(selected)는 focus 와 곱해지므로(selected + focus) 축이다.
#            #grid.selected.part.item(기본 값) · #states.part.selected(상태별로 바뀌는 값)로 그린다.
# 옵션의 `focus / hover` 는 hover 상태에 둔다(값의 note 에 원래 이름).

name: Select

slots:
  trigger: 트리거 — Input 톤 상자, 값 글자
  placeholder: 트리거의 placeholder 글자
  chevron: 트리거 우측 ChevronDown
  helper: 트리거 아래 helper 텍스트
  focusRing: 트리거 키보드 포커스 링
  item: 옵션 한 줄(SelectItem)
  indicator: 옵션 좌측 선택 표시(✓ Check)

variants:
  size:
    md: (only)
  part:
    item: 옵션 한 줄(SelectItem)
  selected:
    unchecked: 선택 안 됨
    checked: 선택됨(`data-state=checked`)

defaults:
  selected: unchecked

states: [enabled, hover, focus-visible, open, disabled, error]

rules:
  # ── 트리거 ────────────────────────────────────────────
  - when: {}
    enabled:
      trigger:
        background: $color-surface-input
        borderColor: $color-border-default
        foreground: { value: $color-text-primary, note: "값" }
      placeholder:
        color: $color-text-tertiary
    hover:
      trigger:
        foreground: { value: $color-text-primary, note: "변화 없음 — 클릭 affordance는 chevron으로" }
    focus-visible:
      trigger:
        borderColor: { value: $color-border-focus, note: "`border-ring` — ring = border-focus(shadcn bridge)" }
      focusRing:
        width: 2px
        color: { value: $color-border-focus / 30%, note: "`ring-2 ring-ring/30`" }
    open:
      trigger:
        borderColor: { value: $color-border-focus, note: "`border-ring` — Radix `data-state=open`" }
    disabled:
      trigger:
        background: { value: $color-surface-input, note: "opacity 0.5" }
        foreground: { value: $color-text-primary, note: "opacity 0.5" }
        cursor: { value: not-allowed, note: "`cursor-not-allowed`" }
    error:
      trigger:
        borderColor: $color-error
      helper:
        color: { value: $color-error, note: "helper 텍스트 `text-error`" }

  # ── 크기(md 하나) ─────────────────────────────────────
  - when: { size: md }
    enabled:
      trigger:
        height: 40px
        paddingY: $spacing-sm
        paddingX: $spacing-md
        typography: $text-body-md
        radius: $radius-sm
      chevron:
        size: 16px

  # ── 옵션 한 줄 ────────────────────────────────────────
  - when: { part: item }
    enabled:
      item:
        background: transparent
        foreground: $color-text-primary
      indicator:
        visibility: hidden
    hover:
      item:
        background: { value: $color-surface-input, note: "focus / hover" }
    disabled:
      item:
        foreground: { value: $color-text-primary, note: "opacity 0.5" }
        pointerEvents: { value: none, note: "`pointer-events: none`" }

  - when: { part: item, selected: checked }
    enabled:
      indicator:
        visibility: { value: visible, note: "✓ — `data-state=checked`" }
