# Input 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.

name: Input

slots:
  root: 입력 상자(container) — 채움 · 외곽선 · 모양, 입력값 글자
  focusRing: 키보드 포커스 링(focus-visible 한정)

# variant 없음, 크기는 md 하나 — 예외는 사용처 className 으로(input.md Sizes).
variants:
  size:
    md: 단일 크기

defaults:
  size: md

states:
  default: ""
  focused: (visible)
  filled: 값이 들어 있음 — 링 없이 입력값 자체로 구별
  error: '(`aria-invalid="true"`)'
  disabled: ""
  readonly: ""

rules:
  - when: {}
    default:
      root:
        height: 40px
        paddingY: $spacing-sm
        paddingX: { value: $spacing-md, note: "`py-[var(--spacing-sm)] px-[var(--spacing-md)]` — Tailwind 기본 spacing 스케일 `py-2 px-3` 대신 디자인 토큰 직접 인용" }
        radius: $radius-sm
        background: $color-surface-input
        foreground: $color-text-primary
        borderColor: $color-border-default
        borderWidth: 1px
        typography: $text-body-lg
        cursor: text
        touchTarget: { value: 40 × N, note: "AA ✓ / AAA ⚠ 미달 — `Button` 동일, 모바일 우선 화면은 size 키울 것" }
    focused:
      root:
        borderColor: { value: $color-border-focus, dark: $color-border-focus-light }
      focusRing:
        width: 2px
        offset: 1px
        color: { value: $color-border-focus, note: "`ring-2 ring-ring/30`" }
    error:
      root:
        borderColor: $color-error
      focusRing:
        width: 2px
        color: { value: $color-error / 30%, note: "`ring-2 ring-error/30`" }
    disabled:
      root:
        background: { value: $color-surface-input, note: "slightly muted" }
        foreground: { value: $color-text-disabled, note: "opacity 0.5" }
        cursor: not-allowed
    readonly:
      root:
        borderColor: { value: none, note: "외곽선 제거" }
        cursor: { value: text, note: "focus·copy만" }
