# 걷음(2026-10-01) — List 의 ListRadioItem 으로 옮겼다(specs/components/list.yaml). 걷기 전 마지막 수치다.
# RadioList 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 선택 여부(inactive · active)는 hover · focus-visible · disabled 와 곱해지므로 상태가 아니라 축(selected)이다.
# 크기에는 기본값을 두지 않는다 — 두면 상태 표(#matrix.selected.*)에 크기 값 칸이 끼어든다. md 가 기본(설명 칸).
# --color-border-subtle · --bg-surface · --bg-canvas · --fs-* · --fw-* · fg-primary · bg-surface-hover 는
# DESIGN.md 토큰이 아니라 앱 쪽 별칭이라 원래 표기 그대로 둔다.
# Pill radius 는 값 칸(6)과 토큰(`var(--radius-md)` = 8px)이 어긋난다 — 토큰을 값으로, 값 칸을 비고로 둔다.

name: RadioList

slots:
  container: ⓐ container — 외곽 border + radius + divide-y
  row: row — full-width button 한 줄
  divider: row 사이 구분선
  pill: ⓑ pill — icon · symbol · swatch
  label: ⓒ label
  subLabel: ⓒ sub-label
  check: ⓓ check (active)
  focusRing: ⓔ focus ring

variants:
  size:
    sm: ""
    md: 기본
    lg: ""
  selected:
    inactive: ""
    active: ""

states:
  enabled: ""
  hover: (inactive)
  focus-visible: ""
  disabled: ""

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      container:
        radius: $radius-lg
        background: { value: var(--bg-surface), note: "(semantic)" }
        borderColor: var(--color-border-subtle)
        borderWidth: 1px
      row:
        background: { value: transparent, note: "(literal)" }
      divider:
        borderColor: var(--color-border-subtle)
        borderWidth: { value: 1px, note: "(row 간만)" }
      pill:
        radius: { value: $radius-md, note: "값 칸은 `6`" }
        background: { value: var(--bg-canvas), note: "(semantic)" }
        fontSize: { value: body-lg, note: "`var(--fs-body-lg)`" }
        fontWeight: { value: bold, note: "`var(--fw-bold)`" }
      label:
        fontSize: { value: 14px, note: "`var(--fs-body)`" }
        fontWeight: { value: semi, note: "`var(--fw-semi)`" }
      subLabel:
        foreground: { value: $color-text-tertiary, note: "(semantic)" }
        fontSize: { value: 11px, note: "`var(--fs-caption)`" }
        fontWeight: regular
      check:
        color: { value: $color-primary, note: "(semantic)" }
    focus-visible:
      focusRing:
        width: 2px
        offset: 2px
        color: { value: $color-border-focus, note: "`ring-2 ring-ring ring-offset-2` — ring = border-focus(shadcn bridge). Row bg · Label (변화 없음)" }
    disabled:
      row:
        opacity: { value: 0.5, note: "`opacity 0.5 cursor-not-allowed` — Row bg · Label (변화 없음)" }
        cursor: not-allowed

  # ── 크기 ──────────────────────────────────────────────
  - when: { size: sm }
    enabled:
      row: { paddingY: 10px, paddingX: 12px, gap: 10px }
      pill: { size: 28px }
      check: { size: 14px }

  - when: { size: md }
    enabled:
      row:
        paddingY: { value: 14px, note: "(literal)" }
        paddingX: { value: 16px, note: "(literal)" }
        gap: { value: $spacing-md, note: "pill ↔ text" }
      pill: { size: { value: 32px, note: "(literal)" } }
      check: { size: { value: 16px, note: "(literal)" } }

  - when: { size: lg }
    enabled:
      row: { paddingY: 16px, paddingX: 20px, gap: 14px }
      pill: { size: 40px }
      check: { size: 18px }

  # ── 선택 여부 ─────────────────────────────────────────
  - when: { selected: inactive }
    enabled:
      label:
        foreground: fg-primary
      check:
        visibility: hidden
    hover:
      row:
        background: { value: bg-surface-hover, note: "(옵션)" }

  - when: { selected: active }
    enabled:
      row:
        background: { value: transparent, note: "또는 호출처 결정" }
      label:
        foreground: fg-primary
      check:
        visibility: { value: visible, note: "✓" }
