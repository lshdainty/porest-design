# Separator 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# variant · size · state 가 없다(정적 시각 요소). orientation(horizontal · vertical)은 굵기 · 길이를
# 어느 쪽(높이 · 너비)에 거느냐만 바꾸므로 축으로 나누지 않고 note 에 적는다.

name: Separator

slots:
  root: 1px 선(Radix `SeparatorPrimitive.Root`)

variants: {}

states:
  default: 정적 — hover · focus · disabled 없음

rules:
  - when: {}
    default:
      root:
        thickness: { value: 1px, note: "`h-px` (horizontal) / `w-px` (vertical)" }
        background: $color-border-default
        length: { value: 부모 100%, note: "`w-full` (horizontal) / `h-full` (vertical)" }
