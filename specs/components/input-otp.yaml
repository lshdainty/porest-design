# InputOTP 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# Input 처럼 filled 를 상태 매트릭스의 한 줄(상태)로 둔다. 바탕은 empty(default).
# focus · error 의 배경은 md 표가 "empty 또는 filled 유지" 라 적었다 — 값이 없으므로 그 표기를
# 그대로 값에 둔다(#matrix 가 empty 의 배경을 대신 보여 주지 않게).

name: InputOTP

slots:
  root: ⓐ container — cell · separator 가로 배치
  cell: ⓑ cell — 한 자리
  separator: ⓒ separator — 그룹 표시(옵션)
  focusRing: 활성 cell 의 outline · error ring

# variant 없음 — 자릿수(maxLength)만 prop 으로 가른다(input-otp.md Variants).
variants: {}

states:
  empty: (default)
  filled: (입력값 있음)
  focus: (active cell)
  error: '(`aria-invalid="true"` on root)'
  disabled: ""

rules:
  - when: {}
    empty:
      root:
        gap: $spacing-xs
      cell:
        width: 40px
        height: 40px
        typography: $text-title-md
        fontFamily: { value: ui-monospace, note: monospace }
        radius: $radius-md
        borderWidth: 1px
        borderColor: $color-border-default
        background: $color-surface-input
        touchTarget: { value: 40 × 40, note: "AA ✓ / AAA ⚠ 미달 (모바일 IME 자동 채우기로 직접 탭 비중 낮음)" }
      separator:
        paddingY: 0
        paddingX: $spacing-xs
    filled:
      cell:
        background: $color-surface-default
        foreground: $color-text-primary
    focus:
      cell:
        background: empty 또는 filled 유지
      focusRing:
        width: { value: 2px, note: outline }
        offset: 1px
        color: $color-border-focus
    error:
      cell:
        background: empty/filled 유지
        borderColor: $color-error
      focusRing:
        width: { value: 2px, note: ring }
        color: $color-error / 30%
    disabled:
      cell:
        background: { value: $color-surface-input, note: opacity 0.5 }
        borderColor: { value: $color-border-default, note: opacity 0.5 }
        cursor: { value: not-allowed, note: "`cursor:not-allowed`" }
