# Avatar 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# fill(variant)의 색과 크기별 초성 글자는 fallback(초성) 부위의 값이다.
# 상태 표는 무엇이 보이느냐(이미지 · fallback)가 행이고 배경 · 글자 칸이 값이 아니라 다른 표를 가리키는
# 말(variant 따름 · 동일)이라, 그 말을 상태 설명으로 옮겼다(input.yaml 의 filled 와 같은 방식).
# 값이 있는 상태는 hover 커서와 focus-visible 링뿐이다.
# defaults 를 두면 상태 표(#matrix)에 변형 · 크기 값이 모든 행의 칸으로 끼어든다 — 기본값은 축 값 설명에 적는다.

name: Avatar

slots:
  root: 원형 컨테이너 — width = height
  image: AvatarImage — 이미지
  fallback: AvatarFallback — 이미지 실패 · 없음일 때의 초성(한글 1글자 · 영문 2글자)
  focusRing: 키보드 포커스 링(avatar 를 감싼 button · link)

variants:
  variant:
    neutral: (default) 동료/팀원 일반 표시 — 절제된 톤.
    primary: 본인/강조 사용자 — preview `.hc-avatar` SoT. brand-color identity.
  size:
    sm: dense list, comment thread.
    md: (default) preview `.hc-avatar` SoT, user row, mention chip.
    lg: profile header (소형), card emphasis.
    xl: profile detail page, hero.

states:
  enabled: (image loaded) — 배경은 이미지, 글자 없음
  enabled-fallback: 배경 · 글자 variant 따름
  image-loading: 배경 · 글자 variant 따름 — fallback 일시 노출
  image-error: 배경 · 글자 variant 따름 — fallback 영구 노출
  hover: interactive — 배경 · 글자 동일
  focus-visible: interactive — 배경 · 글자 동일

rules:
  # ── 공통(상태) ─────────────────────────────────────────
  - when: {}
    hover:
      root:
        cursor: { value: pointer, note: "`cursor-pointer` — avatar가 button/link 안에 있을 때만" }
    focus-visible:
      focusRing:
        width: 2px
        offset: 2px
        color: { value: $color-border-focus, note: "`ring-2 ring-ring ring-offset-2` — ring = border-focus(shadcn bridge)" }

  # ── fill ──────────────────────────────────────────────
  - when: { variant: neutral }
    enabled:
      fallback: { background: $color-surface-input, foreground: $color-text-primary }

  - when: { variant: primary }
    enabled:
      fallback: { background: $color-primary, foreground: $color-text-on-accent }

  # ── 크기 ──────────────────────────────────────────────
  - when: { size: sm }
    enabled:
      root: { size: 32px }
      fallback: { typography: $text-label-sm }

  - when: { size: md }
    enabled:
      root: { size: 40px }
      fallback: { typography: $text-title-sm }

  - when: { size: lg }
    enabled:
      root: { size: 48px }
      fallback: { typography: $text-title-md }

  - when: { size: xl }
    enabled:
      root: { size: 64px }
      fallback: { typography: { value: $text-display-sm, note: "Fallback font (px) 28" } }
