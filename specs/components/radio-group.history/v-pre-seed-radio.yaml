# Radio Group 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# checked 는 hover · focus · disabled 와 곱해지므로 상태가 아니라 축(checked)이다.
# md States 표는 unchecked · checked 조합을 줄로 적었다 — #matrix.checked.unchecked · #matrix.checked.checked 가 그 표다.
# 표에는 `checked + hover` 줄이 없었다. 매트릭스는 모든 상태를 그리므로 checked 의 hover 줄은 기본과 같게 나온다.
# disabled 줄의 "(동일)" 은 테두리 · indicator 가 그 조합의 값 그대로라는 뜻이다.

name: Radio Group

slots:
  item: ⓐ item — 원형 radio 버튼
  indicator: ⓑ indicator — checked 일 때 가운데 채움 dot
  group: RadioGroup — item 들을 담는 grid
  row: item ↔ label 페어
  focusRing: ⓓ focus ring

variants:
  checked:
    unchecked: ""
    checked: ""

states:
  default: ""
  hover: ""
  focus-visible: ""
  disabled: ""

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    default:
      item:
        size: 18px
        radius: $radius-full
      indicator:
        size: 16px
        color: { value: $color-primary, note: "`fill-primary text-primary`" }
      group:
        gap: { value: $spacing-sm, note: "(vertical)" }
      row:
        gap: { value: $spacing-md, note: "item ↔ label — (사용처에서 wrap 시)" }
    focus-visible:
      focusRing:
        width: 2px
        offset: 2px
        color: { value: $color-border-focus, note: "`ring-2 ring-ring ring-offset-2` — ring = border-focus(shadcn bridge)" }
    disabled:
      item:
        opacity: { value: 0.5, note: "(동일) — 테두리 · indicator 는 그 조합 그대로" }
        cursor: not-allowed

  # ── unchecked · checked ───────────────────────────────
  - when: { checked: unchecked }
    default:
      item:
        borderColor: $color-border-strong
        borderWidth: 1px
        cursor: pointer
      indicator:
        visibility: hidden

  - when: { checked: checked }
    default:
      item:
        borderColor: $color-primary
        borderWidth: 1px
        cursor: pointer
      indicator:
        visibility: { value: visible, note: "dot 16×16 `primary`" }

motion:
  item:
    duration: $motion-duration-fast
    easing: $motion-ease-out
    properties: [color, bg, border]
