# Drawer 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 상태는 드로어의 한살이(open · enter · dragging · exit)다. 바탕은 표시 상태인 open.
# 조건 없는 규칙에는 영역별 좌우 여백(header · body · footer)과 상태마다 바뀌는 값만 둔다 —
# #base.open 이 좌우 여백 표, #matrix 가 상태 표다.
# side 별 값은 크기 표가 두 side 에 모두 적어 둔 공통 값(여백 · 간격 · 그림자 · 테두리 · z-index)까지
# side 규칙에 그대로 둔다. 상태 표의 open 줄이 가리키는 overlay 색도 두 side 의 바탕 값이라 여기 있다.
# side 에는 기본값을 두지 않는다 — 두면 상태 표(#matrix)에 side 값 칸이 모두 끼어든다.
# 기본 side 가 bottom 이라는 건 bottom 설명에 적는다.

name: Drawer

slots:
  root: ⓐ container — 표면 · 모양 · 폭 · 그림자
  handle: ⓑ handle — bottom 전용
  overlay: 페이지 dim
  header: ⓒ header — 제목 + 닫기
  body: ⓔ body
  footer: ⓕ footer — 액션

variants:
  side:
    bottom: (default) 모바일 표준 — 거래 입력, 공유, action sheet. handle bar 노출.
    right: 데스크탑 보조 패널 — 필터, 세부 정보 보기. handle 생략.

states:
  open: 표시 상태, overlay dim 적용 — spec 그대로
  enter: "bottom: 아래에서 위로 / side: 우측에서 좌측으로 슬라이드"
  dragging: (bottom) 사용자가 handle 또는 body 영역을 잡고 드래그 중
  exit: drag 거리 30%+ 또는 swipe / close click / overlay click / Escape 시

rules:
  # ── 공통: 영역별 좌우 여백 · 상태 ──────────────────────
  - when: {}
    open:
      header:
        paddingLeft: $spacing-xl
        paddingRight: $spacing-sm
        paddingTop: pt-2
        paddingBottom: pb-4
      body:
        paddingLeft: $spacing-xl
        paddingRight: $spacing-xl
        paddingY: { value: —, note: 스크롤 }
      footer:
        paddingLeft: $spacing-xl
        paddingRight: $spacing-xl
        paddingY: py-3
    enter:
      root:
        # 옮기기 전 표는 250ms 라 적었다. 토큰은 200ms — 값은 고치지 않았다.
        transitionDuration: { value: $motion-duration-base, note: "옮기기 전 표기 250ms — 토큰 값과 다르다" }
        transitionEasing: $motion-ease-out
    dragging:
      root:
        transform: translateY(drag offset)
    exit:
      root:
        transitionDuration: $motion-duration-base
        # DESIGN.md 에 motion-ease-in 토큰이 없다(easing 은 ease-out 단독) — 원래 표기 그대로.
        transitionEasing: motion-ease-in

  # ── side 별 ───────────────────────────────────────────
  - when: { side: bottom }
    open:
      root:
        width: { value: 100%, note: "full width — `width:100%`" }
        height: { value: auto, note: content }
        padding: $spacing-lg
        gap: { value: $spacing-md, note: 자식 간 }
        radius: { value: $radius-2xl, note: "top corners(top 양쪽) — `radius-2xl radius-2xl 0 0`" }
        borderColor: none
        shadow: $shadow-xl
        zIndex: { value: 101, note: "content — [`z-index.md`](../z-index.md) L2 modal content" }
      handle:
        margin: "-4px auto var(--spacing-sm)"
      overlay:
        background: $overlay-dim-light
        zIndex: { value: 100, note: "[`z-index.md`](../z-index.md) L2 modal overlay" }

  - when: { side: right }
    open:
      root:
        width: { value: 280–360px, note: "`width:280–360`" }
        height: { value: 100%, note: stretch }
        padding: $spacing-lg
        gap: { value: $spacing-md, note: 자식 간 }
        radius: { value: $radius-2xl, note: "left corners(left 양쪽) — `radius-2xl 0 0 radius-2xl`" }
        borderColor: none
        shadow: $shadow-xl
        zIndex: { value: 101, note: "content — [`z-index.md`](../z-index.md) L2 modal content" }
      overlay:
        background: $overlay-dim-light
        zIndex: { value: 100, note: "[`z-index.md`](../z-index.md) L2 modal overlay" }
