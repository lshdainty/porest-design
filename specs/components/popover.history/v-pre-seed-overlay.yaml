# Popover 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 크기 변형도 상태별 값도 없어 조건 없는 규칙 하나다(#base).
# compact pill trigger 의 "xs · sm" 는 세로 · 가로 순서다(md Migration notes 의 `var(--spacing-xs) var(--spacing-sm)`).
# md 의 States 표(closed · open · enter · exit · outside click · Escape)는 수명 주기 · 상호작용이라 md 에 남겼다.

name: Popover

slots:
  content: ⓑ content — floating 패널
  compactTrigger: ⓐ compact pill trigger(preview `.pop-trigger`) — outline button 은 Button `variant="outline"` `size="md"`
  actions: ⓒ actions — 짧은 액션 쌍

variants: {}

states: [default]

rules:
  - when: {}
    default:
      content:
        width: { value: 288px, note: "`w-72` — (literal)" }
        padding: $spacing-md
        gap: { value: $spacing-sm, note: "자식 간" }
        radius: $radius-md
        borderWidth: 1px
        borderStyle: solid
        borderColor: $color-border-default
        shadow: $shadow-md
        zIndex: { value: 200, note: "`z-[200]` (L3 modal-aware floating) — [`z-index.md`](../z-index.md)" }
        sideOffset: { value: 4px, note: "trigger ↔ content — (Radix 기본)" }
      compactTrigger:
        paddingY: $spacing-xs
        paddingX: $spacing-sm
        radius: $radius-md
        typography: $text-caption
      actions:
        gap: $spacing-xs
