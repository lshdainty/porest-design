# Toggle 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 켬 · 끔(pressed)은 hover · focus-visible · disabled 와 곱해지므로 상태가 아니라 축이다.
# outline 의 테두리는 off 에서 border-default, on 에서 border-strong 이다({ variant: outline, pressed: on }).
# size 에는 기본값을 두지 않는다 — 상태 표(#matrix.variant.outline.pressed.…)에 크기 칸이 끼지 않도록.
# default 가 기본 크기다(설명 칸). 글자 · 아이콘은 모든 크기에서 같아 공통 규칙에 둔다.

name: Toggle

slots:
  root: ⓐ container — 채움 · 테두리 · 글자
  icon: ⓑ 아이콘(선택)
  focusRing: ⓓ 키보드 포커스 링

variants:
  variant:
    default: 텍스트 에디터 toolbar — 여러 toggle이 인접 배치되는 dense UI.
    outline: 독립 toggle — filter chip, view 옵션처럼 단독 또는 sparse 배치. preview `.tg` SoT.
  size:
    sm: ""
    default: 기본
    lg: ""
  pressed:
    off: ""
    on: (`data-state=on`)

defaults:
  variant: default

states: [enabled, hover, focus-visible, disabled]

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      root:
        typography: $text-caption
        fontWeight: 600
      icon:
        size: 16px
    focus-visible:
      focusRing:
        width: 2px
        offset: 2px
        color: { value: $color-border-focus, note: "`ring-2 ring-ring ring-offset-2` — ring = border-focus(shadcn bridge)" }
    disabled:
      root:
        opacity: 0.5
        pointerEvents: { value: none, note: "`pointer-events: none`" }

  # ── 변형 ──────────────────────────────────────────────
  - when: { variant: default }
    enabled:
      root:
        borderColor: { value: transparent, note: "없음" }

  - when: { variant: outline }
    enabled:
      root:
        borderWidth: 1px
        borderColor: $color-border-default

  # ── 크기 ──────────────────────────────────────────────
  - when: { size: sm }
    enabled:
      root: { paddingY: $spacing-xs, paddingX: $spacing-sm, minHeight: 28px }

  - when: { size: default }
    enabled:
      root: { paddingY: $spacing-xs, paddingX: $spacing-md, minHeight: 32px }

  - when: { size: lg }
    enabled:
      root: { paddingY: $spacing-sm, paddingX: $spacing-lg, minHeight: 40px }

  # ── 켬 · 끔 ───────────────────────────────────────────
  - when: { pressed: off }
    enabled:
      root:
        background: transparent
        foreground: $color-text-secondary
    hover:
      root:
        background: $color-surface-input
        foreground: $color-text-primary

  - when: { pressed: on }
    enabled:
      root:
        background: $color-surface-input
        foreground: $color-text-primary

  - when: { variant: outline, pressed: on }
    enabled:
      root:
        borderColor: $color-border-strong
