# Breadcrumb 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 상태는 Link 의 것이다. 현재 페이지(page)와 separator · ellipsis 는 상태가 없어 값이 바탕(enabled)에 있고,
# md 에서는 부위마다 `#base.enabled@page` · `@separator` · `@ellipsis` 로 그린다.
# defaults 를 두면 Link 상태 표(#matrix)에 separator 변형 값이 모든 행의 칸으로 끼어든다 — 기본값은 축 값 설명에 적는다.

name: Breadcrumb

slots:
  list: BreadcrumbList(`<ol>`) — 항목 · separator 를 한 줄로
  item: BreadcrumbItem(`<li>`)
  link: BreadcrumbLink(`<a>`) — 상위 페이지
  page: BreadcrumbPage — 현재 페이지(non-clickable)
  separator: "`>` 또는 `/`"
  ellipsis: 긴 경로 축약(선택)
  focusRing: 키보드 포커스 링(link)

variants:
  separator:
    chevron: (default) 일반 페이지 navigation. 시각적으로 방향성 명확(좌→우 위계 흐름).
    slash: URL-like 또는 dense 레이아웃. preview brand vignette `.bc` SoT.

states: [enabled, hover, focus-visible, pressed]

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      list:
        typography: $text-body-sm
        gap: { value: $spacing-sm, note: item ↔ separator ↔ item }
      item:
        gap: { value: $spacing-sm, note: link ↔ chevron }
      link:
        foreground: $color-text-secondary
      page:
        foreground: { value: $color-text-primary, note: 'current — `aria-current="page"`' }
        fontWeight: 500
      separator:
        foreground: { value: $color-text-tertiary, note: 정적 }
        iconSize: 14px
      ellipsis:
        foreground: { value: $color-text-tertiary, note: 정적 }
        size: { value: 36px, note: hit area }
        iconSize: 16px
    hover:
      link:
        foreground: { value: $color-text-primary, note: "`transition-[color]`" }
    focus-visible:
      link:
        foreground: $color-text-primary
      focusRing:
        width: 2px
        offset: 2px
        color: { value: $color-border-focus, note: "`ring-2 ring-ring ring-offset-2` — ring = border-focus(shadcn bridge)" }
        radius: $radius-xs
    pressed:
      link:
        foreground: { value: $color-text-primary, note: 전환 중 }

  # ── separator ─────────────────────────────────────────
  - when: { separator: chevron }
    enabled:
      separator:
        glyph: { value: ">", note: "`ChevronRight` svg" }

  - when: { separator: slash }
    enabled:
      separator:
        glyph: { value: /, note: 텍스트 }

motion:
  link:
    duration: $motion-duration-fast
    easing: $motion-ease-out
    properties: [color]
