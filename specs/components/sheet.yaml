# Sheet 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# size variant 가 없다. 크기 · 모양은 기본 상태(closed)의 조건 없는 규칙에 두고 open · closing 이
# 그대로 물려받는다. closed 의 unmounted 는 상태 설명에 둔다 — 기본 상태에 값으로 두면 크기 표(#base.closed)에 섞인다.
# right/left 패널 너비는 화면 폭마다 달라 축(viewport)으로 둔다. side(4방향)별 위치 · 폭/높이 · border 방향은
# sheet.md 의 Variants (side) 표(사용처 포함)에 있다.
# 열고 닫는 시간은 motion 에 있다.

name: Sheet

slots:
  container: 패널 — 가장자리에 붙는 floating 카드
  overlay: 뒤 dim
  header: title + description 묶음
  title: 제목
  description: 설명(선택)
  footer: 버튼 줄(선택)
  close: 우상단 닫기 버튼(X)

variants:
  viewport:
    mobile: "< 480px (`sm` 미만)"
    desktop: "≥ 480px (`sm:` — breakpoint-sm)"

states:
  closed: (default) — unmounted
  open: full Sheet 표시
  closing: (in transition) — 슬라이드 + dim fade out

rules:
  - when: {}
    closed:
      container:
        padding: { value: 24px, note: "`p-[var(--spacing-2xl)]`" }
        gap: { value: $spacing-md, note: "header/body/footer 사이" }
        borderWidth: { value: 1px, note: "방향별 — `border-{l/r/t/b} border-border-default`" }
        borderColor: $color-border-default
        background: $color-surface-default
        shadow: { value: $shadow-xl, note: "inline `var(--shadow-xl)`" }
        height: { value: content auto, note: "top/bottom — (자동)" }
        zIndex: { value: 101, note: "z-modal-content — specs/z-index.md L2 표면(딤은 z-modal 100). 옛 값 50 은 층 표 · 레시피와 어긋나 있었다(v116 에서 맞춤)" }
      header:
        gap: { value: $spacing-xs, note: "title ↔ description" }
      footer:
        gap: { value: $spacing-sm, note: "footer button 사이" }
      title:
        typography: $text-title-md
        fontWeight: 600
      description:
        typography: $text-body-sm
      close:
        width: 28px
        height: 28px
        iconSize: 16px
    open:
      container:
        mount: mounted
        animation: "slide-in-from-{side}"
      overlay:
        animation: fade-in-0
    closing:
      container:
        mount: unmounting
        animation: "slide-out-to-{side}"
      overlay:
        animation: fade-out-0

  - when: { viewport: mobile }
    closed:
      container:
        width: { value: 75%, note: "right/left — `w-3/4`" }

  - when: { viewport: desktop }
    closed:
      container:
        width: { value: ≤384px, note: "right/left — `sm:max-w-sm`" }

motion:
  open: { duration: 500ms, note: "`data-[state=open]:duration-500`" }
  close: { duration: 300ms, note: "`data-[state=closed]:duration-300`" }
