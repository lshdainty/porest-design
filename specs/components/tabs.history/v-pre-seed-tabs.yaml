# Tabs 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 선택 여부(active · inactive)는 hover · focus 와 곱해지므로 상태가 아니라 축(selected)이다.
# 변형별 바탕 값은 { variant } 규칙, 선택됐을 때 바뀌는 값은 { variant, selected: active } 규칙,
# sm 크기는 { variant, size: sm } 규칙에 있다.

name: Tabs

slots:
  list: TabsList — 트리거를 담는 줄
  trigger: TabsTrigger — 탭 하나
  iconOnly: 아이콘만 있는 트리거
  content: TabsContent — 선택한 탭의 내용
  focusRing: 키보드 포커스 링

variants:
  variant:
    container: surface-input 상자 안의 알약 — 설정 · 폼 섹션 토글
    underline: 색 없는 줄 + active 2px 하단 라인 — 프로필 · 상세 navigation
    pills: 둥근 사각 + active primary 채움 — 모바일 navigation
  size:
    default: 기본
    sm: 작은 크기 — container · pills
  selected:
    inactive: 선택 안 됨
    active: 선택됨(`data-state=active`)

defaults:
  variant: container
  size: default
  selected: inactive

states:
  enabled: ""
  hover: (inactive only)
  focus-visible: ""
  disabled: ""

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    focus-visible:
      focusRing:
        width: 2px
        offset: 2px
        color: { value: $color-border-focus, note: "`ring-2 ring-ring ring-offset-2` — ring = border-focus(shadcn bridge)" }
    disabled:
      trigger:
        opacity: 0.5

  # ── 변형별 바탕(선택 안 됨 · 크기 default) ─────────────
  - when: { variant: container }
    enabled:
      list:
        height: 40px
        padding: { value: $spacing-xs, note: "`p-[var(--spacing-xs)]`" }
        gap: 0
        radius: $radius-sm
        background: $color-surface-input
      trigger:
        minHeight: { value: 32px, note: "`min-h-8`" }
        paddingY: $spacing-xs
        paddingX: $spacing-md
        radius: { value: $radius-xs, note: "`rounded-xs`" }
        typography: $text-label-md
        fontWeight: { value: 500, note: "`font-medium`" }
        foreground: $color-text-secondary
      iconOnly:
        width: 32px
        height: 32px
        iconSize: { value: 16px, note: "`[&_svg]:size-4`" }
      content:
        marginTop: { value: $spacing-sm, note: "`mt-[var(--spacing-sm/md)]`" }
    disabled:
      trigger:
        pointerEvents: { value: none, note: "`pointer-events-none`" }

  - when: { variant: underline }
    enabled:
      list:
        height: auto
        padding: 0
        gap: 0
        radius: 0
        background: transparent
        borderBottomWidth: 1px
        borderBottomColor: { value: $color-border-default, note: "`border-b border-default`" }
      trigger:
        paddingY: $spacing-sm
        paddingX: $spacing-md
        radius: 0
        typography: $text-label-md
        fontWeight: 500
        foreground: $color-text-secondary
        borderBottomWidth: 2px
        borderBottomColor: { value: transparent, note: "`border-b-2 border-transparent`" }
      content:
        paddingTop: { value: $spacing-lg, note: "`pt-[var(--spacing-lg)]` — bottom border 아래 여유" }

  - when: { variant: pills }
    enabled:
      list:
        height: auto
        padding: 0
        gap: { value: $spacing-xs, note: "`gap-[var(--spacing-xs)]`" }
        radius: 0
        background: transparent
      trigger:
        minHeight: { value: ≈36, note: "내용 높이" }
        paddingY: $spacing-sm
        paddingX: $spacing-md
        radius: { value: $radius-md, note: "`rounded-md`" }
        typography: $text-label-md
        fontWeight: { value: 500, note: "active 600" }
        background: transparent
        foreground: $color-text-secondary
      content:
        marginTop: $spacing-md

  # ── 선택됐을 때 바뀌는 값 ──────────────────────────────
  - when: { variant: container, selected: active }
    enabled:
      trigger:
        background: $color-surface-default
        shadow: $shadow-sm
        foreground: $color-text-primary
        fontWeight: 500

  - when: { variant: underline, selected: active }
    enabled:
      trigger:
        background: transparent
        shadow: none
        foreground: $color-text-primary
        fontWeight: 500
        borderBottomColor: { value: $color-primary, note: "2px solid — `border-b-2 border-primary`" }

  - when: { variant: pills, selected: active }
    enabled:
      trigger:
        background: $color-primary
        shadow: none
        foreground: $color-text-on-accent
        fontWeight: { value: 600, note: "`font-semibold`" }

  # ── 크기 sm ───────────────────────────────────────────
  - when: { variant: container, size: sm }
    enabled:
      list:
        height: 32px
        padding: { value: 2px, note: "`p-0.5`" }
      trigger:
        minHeight: { value: 28px, note: "`min-h-7`" }
        paddingX: $spacing-sm
        typography: $text-label-sm
        fontWeight: { value: 500, note: "`font-medium`" }
      iconOnly:
        width: 28px
        height: 28px

  - when: { variant: pills, size: sm }
    enabled:
      trigger:
        minHeight: { value: 28px, note: "`min-h-7`" }
        paddingY: $spacing-xs
        paddingX: $spacing-sm
        typography: $text-label-sm

  # ── 상태 ──────────────────────────────────────────────
  - when: { selected: inactive }
    hover:
      trigger:
        foreground: $color-text-primary

  - when: { variant: pills, selected: inactive }
    hover:
      trigger:
        background: $color-surface-input / 50%
