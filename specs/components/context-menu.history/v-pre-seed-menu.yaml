# Context Menu 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# item 의 destructive 는 hover 와 곱해지므로 상태가 아니라 축(variant — recipe 의 `variant` prop)이다.
# States 표에서 destructive 가 붙지 않은 줄(hover / focus · pressed · disabled)은 default item 값으로,
# destructive 줄은 { variant: destructive } 규칙으로 옮겼다 — 표에 없는 destructive pressed · disabled 는 비워 둔다.
# inset item 의 좌측 여백은 부위(itemInset)로 둔다.

name: Context Menu

slots:
  container: 메뉴 상자 — preview `.ctx`
  item: item row — preview `.ctx-item`
  itemInset: inset item — checkbox/radio item 과 섞일 때
  separator: separator — preview `.ctx-sep`
  shortcut: 우측 키보드 단축키

variants:
  variant: [default, destructive]

defaults:
  variant: default

states:
  enabled: ""
  "hover / focus": "(focus-visible는 hover와 동일 시각 — outline 별도 없음, 메뉴 내 focus는 `aria-activedescendant`로 관리)"
  pressed: ""
  disabled: ""

rules:
  # ── 공통 크기 ─────────────────────────────────────────
  - when: {}
    enabled:
      container:
        padding: $spacing-xs
        radius: $radius-md
        shadow: $shadow-md
        borderWidth: 1px
        borderStyle: solid
        borderColor: $color-border-default
        minWidth: 160px
      item:
        paddingY: $spacing-sm
        paddingX: $spacing-md
        radius: $radius-sm
        typography: $text-body-md
      itemInset:
        paddingLeft: $spacing-xl
      separator:
        marginY: $spacing-xs
      shortcut:
        fontSize: $text-label-sm

  # ── item 변형별 색 · 상태 ─────────────────────────────
  - when: { variant: default }
    enabled:
      item:
        background: transparent
        foreground: $color-text-primary
    "hover / focus":
      item:
        background: $color-surface-input
    pressed:
      item:
        background: { value: $color-surface-input, note: "즉시 dismiss" }
    disabled:
      item:
        opacity: 0.5
        pointerEvents: { value: none, note: "`pointer-events: none`" }

  - when: { variant: destructive }
    enabled:
      item:
        background: transparent
        foreground: $color-error
    "hover / focus":
      item:
        background: { value: $color-error / 12%, note: "error 12% mix" }
        foreground: $color-error
