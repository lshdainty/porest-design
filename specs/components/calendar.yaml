# Calendar 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 상태는 날짜(day) 의 것이다. 상태 표가 today + selected 를 한 줄로 적어 두어 today · selected 를 축으로
# 곱하지 않고 그대로 상태 목록으로 둔다. range 배경은 셀(td, cell)이, 원과 글자는 DayButton(day)이 맡는다.
# mode(single · multiple · range)는 동작만 다르고 시각 값은 같아 축으로 두지 않는다(calendar.md Variants).
# Sizes 표의 상태별 줄(hover · selected · today · range · outside · disabled)은 그 상태 규칙에 있다.

name: Calendar

slots:
  root: DayPicker — 외곽
  caption: month_caption — "2026년 5월"
  nav: button_previous · button_next
  weekday: 요일 header(`<th>`)
  week: 한 주(`<tr>`)
  cell: 날짜 셀(`<td>`) — range 배경
  day: DayButton — 날짜 원 · 글자
  focusRing: 키보드 포커스 링(day)

variants: {}

states:
  default: ""
  hover: ""
  focus-visible: ""
  today: (선택 안 됨)
  selected: ""
  today-selected: (today + selected) — selected 우선
  range-start: / `range-end`
  range-middle: rounded 없음
  outside: (이전/다음 달)
  disabled: (휴일 등)
  weekend: (선택 사항)

rules:
  - when: {}
    default:
      root:
        padding: $spacing-md
      caption:
        typography: $text-title-sm
      nav:
        size: { value: 28px, note: "`Button` `variant=\"outline\"`" }
        iconSize: { value: 16px, note: "`ChevronLeft`/`Right`" }
      weekday:
        width: 40px
        height: 32px
        typography: $text-caption
        fontWeight: 600
        foreground: $color-text-tertiary
        textTransform: { value: uppercase, note: "`uppercase tracking-wide`" }
      week:
        marginTop: { value: $spacing-xs, note: row gap }
      day:
        size: 40px
        radius: { value: $radius-full, note: full pill }
        typography: $text-body-md
        background: transparent
        foreground: $color-text-primary
    hover:
      day:
        background: $color-surface-input
    focus-visible:
      focusRing:
        width: 2px
        offset: 2px
        color: { value: $color-border-focus, note: "`ring-2 ring-ring ring-offset-2` — ring = border-focus(shadcn bridge)" }
    today:
      day:
        fontWeight: 600
        outlineWidth: 2px
        outlineColor: $color-primary
        outlineOffset: -2px
    selected:
      day:
        background: $color-primary
        foreground: $color-text-on-accent
        fontWeight: 600
    today-selected:
      day:
        background: $color-primary
        foreground: $color-text-on-accent
        fontWeight: 600
    range-start:
      cell:
        background: { value: $color-primary / 12%, note: "좌/우 절반 그라데이션 — `linear-gradient(to_right|left, transparent 50%, color-mix(primary,12%) 50%)`" }
      day:
        background: { value: $color-primary, note: button — 원형 }
        foreground: $color-text-on-accent
        fontWeight: 600
    range-middle:
      cell:
        background: { value: $color-primary / 12%, note: "cell 전체 (사각형) — `color-mix(primary,12%)`" }
      day:
        background: { value: transparent, note: button }
    outside:
      day:
        foreground: $color-text-tertiary
    disabled:
      day:
        foreground: $color-text-tertiary
        opacity: 0.5
        cursor: not-allowed
    weekend:
      day:
        foreground: $color-text-tertiary

motion:
  day:
    duration: $motion-duration-fast
    properties: [colors]
    note: "`transition-colors`"
