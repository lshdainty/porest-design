# Chart 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# Chart Palette 10색은 palette 축의 값이다 — 시리즈마다 한 색을 고르므로 축으로 두면 표가
# 색마다 한 줄로 그려지고(#palette), 공통 크기 표(#base.default)와 섞이지 않는다.
# 다크 값은 각 색의 `-light` 짝이다(chart.md 규칙 — `theme.dark: var(--color-chart-*-light)`).
# tooltip 의 series indicator 모양(dot · line · dashed)은 indicator 축이다.

name: Chart

slots:
  container: ChartContainer
  tick: Axis tick 텍스트
  gridLine: CartesianGrid 선
  tooltip: ChartTooltipContent
  indicator: tooltip 의 시리즈 indicator
  legend: ChartLegend
  series: 시리즈(Bar/Line/Area/Pie/Radial 등) — fill/stroke

variants:
  indicator: [dot, line, dashed]
  palette:
    red: 위험·감소·error
    orange: 경고·임박
    yellow: 주의·노란 카테고리
    green: 성장·성공·growth
    blue: 정보·neutral 기본 추세
    indigo: 보조 추세·analytics
    violet: premium·창의
    pink: HR·social
    brown: 안정·legacy
    gray: 비활성·기타

states: [default]

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    default:
      container:
        aspectRatio: { value: "16:9", note: "`aspect-video` (사용처 override 가능)" }
      tick:
        color: { value: $color-text-secondary, note: "(inline class override)" }
      gridLine:
        color: { value: $color-border-default / 50%, note: "(inline class override)" }
      tooltip:
        minWidth: { value: 128px, note: "`min-w-[8rem]`" }
        paddingX: $spacing-md
        paddingY: $spacing-sm
        borderWidth: 1px
        borderStyle: solid
        borderColor: $color-border-default
        radius: $radius-sm
        shadow: { value: $shadow-md, note: 'inline — `style={{ boxShadow: "var(--shadow-md)" }}`' }
        typography: { value: $text-label-sm, note: "+ tabular-nums — `font-mono tabular-nums` (value)" }
      legend:
        gap: { value: $spacing-sm, note: "Recharts 기본" }

  # ── tooltip indicator ────────────────────────────────
  - when: { indicator: dot }
    default:
      indicator:
        width: 10px
        height: 10px
        radius: { value: 2px, note: "`rounded-[2px]`" }

  - when: { indicator: line }
    default:
      indicator:
        width: { value: 4px, note: "4×height" }

  - when: { indicator: dashed }
    default:
      indicator:
        width: 0
        background: transparent
        borderWidth: 1.5px
        borderStyle: dashed

  # ── Chart Palette ────────────────────────────────────
  - when: { palette: red }
    default:
      series:
        color: { value: $color-chart-red, dark: $color-chart-red-light }

  - when: { palette: orange }
    default:
      series:
        color: { value: $color-chart-orange, dark: $color-chart-orange-light }

  - when: { palette: yellow }
    default:
      series:
        color: { value: $color-chart-yellow, dark: $color-chart-yellow-light }

  - when: { palette: green }
    default:
      series:
        color: { value: $color-chart-green, dark: $color-chart-green-light }

  - when: { palette: blue }
    default:
      series:
        color: { value: $color-chart-blue, dark: $color-chart-blue-light }

  - when: { palette: indigo }
    default:
      series:
        color: { value: $color-chart-indigo, dark: $color-chart-indigo-light }

  - when: { palette: violet }
    default:
      series:
        color: { value: $color-chart-violet, dark: $color-chart-violet-light }

  - when: { palette: pink }
    default:
      series:
        color: { value: $color-chart-pink, dark: $color-chart-pink-light }

  - when: { palette: brown }
    default:
      series:
        color: { value: $color-chart-brown, dark: $color-chart-brown-light }

  - when: { palette: gray }
    default:
      series:
        color: { value: $color-chart-gray, dark: $color-chart-gray-light }
