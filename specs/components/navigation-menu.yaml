# Navigation Menu 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# Trigger 패턴마다 다른 여백 · 너비 · 아이콘은 pattern 축에, 나머지 크기는 조건 없는 규칙에 있다.
# md Sizes 의 "Trigger padding (text)" 는 글자 패턴 둘(text-chevron · text-only)에 같이 둔다.
# 상태는 Trigger / Link 와 Card link(Viewport 내)가 따로라 part 축으로 가른다 — Card link 에는
# hover · focus-visible 만 있다. Card link 의 기본 값은 조건 없는 규칙(cardLink · cardTitle · cardDesc)에 있다.

name: Navigation Menu

slots:
  root: Trigger / Link 상자 — ⓑ Trigger · ⓒ ⓓ ⓔ Link
  list: Trigger 들을 담는 줄
  chevron: ⓑ 의 ChevronDown
  icon: ⓓ ⓔ 의 lucide 아이콘
  viewport: ⓕ NavigationMenuContent / Viewport
  indicator: ⓖ NavigationMenuIndicator 의 화살표
  cardLink: ⓗ NavigationMenuLink (Viewport 내) — 카드
  cardTitle: 카드 title
  cardDesc: 카드 description
  focusRing: 키보드 포커스 링

variants:
  pattern:
    text-chevron: "`text + chevron` (default Trigger) — 카테고리 hub, viewport 에 sub-content 노출"
    text-only: "`text-only` (Link) — viewport 없는 직접 링크"
    icon-only: "`icon-only` (Link) — universal action(검색 · 알림 · 사용자)"
    text-icon: "`text + icon` (Link) — 강조 액션(다운로드 · 외부 링크)"
  part:
    trigger: Trigger / Link
    cardLink: Card link (Viewport 내)

states:
  default: ""
  hover: ""
  focus-visible: ""
  open: "`data-state=open` (Trigger)"
  active: "`data-active` (현재 페이지)"
  disabled: ""

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    default:
      root:
        height: 40px
        radius: $radius-sm
        typography: $text-body-md
        fontWeight: 500
      list:
        gap: { value: $spacing-xs, note: "`space-x-[var(--spacing-xs)]` (또는 flex gap)" }
      chevron:
        size: 12px
      viewport:
        marginTop: $spacing-xs
        minWidth: { value: 사용처 결정, note: "`md:w-[400px]` 등" }
        padding: { value: $spacing-lg, note: "(사용처) — 또는 사용처 결정" }
        radius: $radius-md
        background: $color-surface-default
        borderWidth: 1px
        borderColor: $color-border-default
        shadow: { value: $shadow-lg, note: "inline — `style={{ boxShadow: \"var(--shadow-lg)\" }}`" }
      indicator:
        size: 8px
        radius: { value: $radius-sm, note: "왼쪽 위만 — `rounded-tl-sm`" }
        background: $color-border-default
        rotate: 45°
      cardLink:
        padding: $spacing-md
        gap: { value: $spacing-xs, note: "title↔desc" }
        background: transparent
      cardTitle:
        typography: $text-title-sm
        fontWeight: 500
        foreground: $color-text-primary
      cardDesc:
        typography: $text-body-sm
        foreground: $color-text-secondary

  # ── Trigger 패턴 ──────────────────────────────────────
  - when: { pattern: text-chevron }
    default:
      root: { paddingY: $spacing-sm, paddingX: $spacing-lg }

  - when: { pattern: text-only }
    default:
      root: { paddingY: $spacing-sm, paddingX: $spacing-lg }

  - when: { pattern: icon-only }
    default:
      root:
        width: { value: 40px, note: "40×40 정사각 — Button icon size 정합" }
      icon:
        size: { value: 18px, note: "또는 lucide `size={18}`" }

  - when: { pattern: text-icon }
    default:
      root:
        paddingX: { value: $spacing-md, note: "값 칸은 `16 가변`" }
        gap: $spacing-xs
      icon:
        size: 16px

  # ── 상태: Trigger / Link ──────────────────────────────
  - when: { part: trigger }
    default:
      root:
        background: { value: $color-surface-default, note: "또는 transparent" }
        foreground: $color-text-primary
    hover:
      root:
        background: $color-surface-input
    focus-visible:
      root:
        background: $color-surface-input
      focusRing:
        width: 2px
        offset: 2px
        color: { value: $color-border-focus, note: "`ring-2 ring-ring ring-offset-2` — ring = border-focus(shadcn bridge)" }
    open:
      root:
        background: $color-surface-input / 50%
      chevron:
        rotate: 180°
    active:
      root:
        background: $color-surface-input / 50%
    disabled:
      root:
        background: transparent
        opacity: 0.5
        cursor: { value: not-allowed, note: "`cursor-not-allowed`" }

  # ── 상태: Card link ───────────────────────────────────
  - when: { part: cardLink }
    hover:
      cardLink:
        background: { value: $color-surface-input, note: "시각 (변화 없음)" }
    focus-visible:
      cardLink:
        background: $color-surface-input
      focusRing:
        width: 2px
        color: { value: $color-border-focus, note: "`ring-2 ring-ring` — ring = border-focus(shadcn bridge)" }

motion:
  trigger:
    duration: $motion-duration-fast
    easing: $motion-ease-out
    properties: [colors]
  chevron:
    duration: $motion-duration-base
    properties: [transform]
