# 걷음(2026-10-01) — Field(specs/components/field.yaml)의 머리로 옮겼다. 걷기 전 마지막 수치다.
# Label 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 크기 표는 #base.default, 상태 표는 #matrix 로 그린다(Input 과 같다). 크기 표의 peer-disabled
# 두 줄(opacity · cursor)은 상태 값이라 상태 표의 peer-disabled 줄에 나온다.
# Label 자체는 인터랙티브가 아니다 — 상태는 페어 컨트롤이 정한다(label.md States).

name: Label

slots:
  root: ⓐ label text
  required: ⓑ required marker — `*`

# variant · size 없음 — text-label-md 단일 spec(label.md Variants · Sizes).
variants: {}

states:
  default: ""
  peer-disabled: Tailwind `peer` 패턴 — 같은 부모 안 `peer` className 컨트롤이 disabled 시 자동 적용.
  peer-invalid: (Label 자체는 변화 없음 — error 시각은 helper text가 담당.)

rules:
  - when: {}
    default:
      root:
        typography: $text-label-md
        lineHeight: { value: "1.0", note: "override — none(`leading-none`)" }
        foreground: $color-text-primary
        cursor: { value: pointer, note: htmlFor가 click target 위임 }
        opacity: "1.0"
      required:
        foreground: $color-error
        fontWeight: 500
    peer-disabled:
      root:
        opacity: { value: 0.7, note: "`peer-disabled:opacity-70`" }
        cursor: { value: not-allowed, note: "`peer-disabled:cursor-not-allowed`" }
    peer-invalid:
      root:
        cursor: { value: pointer, note: 동일 }
