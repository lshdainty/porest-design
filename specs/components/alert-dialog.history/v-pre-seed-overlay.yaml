# AlertDialog 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 시각은 Dialog 와 같아(alert-dialog.md) 여기에는 AlertDialog 만의 값 — z-index 층 — 만 있다.
# 층의 정책은 specs/z-index.md L5 alert-dialog.

name: AlertDialog

slots:
  overlay: 페이지 전체 딤 — click 무시
  content: container(AlertDialogContent)

variants: {}

states: [open]

rules:
  - when: {}
    open:
      overlay:
        zIndex: 300
      content:
        zIndex: 301
