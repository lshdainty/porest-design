# Alert 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# Sizes 표의 (semantic) 두 줄 — 왼쪽 accent strip 두께와 color-mix 배경 — 은 default 에는 없는 값이라
# 공통 규칙이 아니라 semantic 변형(info · success · warning · error) 규칙에 있다.
# 상태 표(visible · closing …)는 동작 표라 alert.md 에 남아 있다.

name: Alert

slots:
  root: container — 배경 · 테두리 · 모양 · 안쪽 여백
  borderLeft: 왼쪽 accent strip(border-left) — semantic 변형만
  icon: stroke svg 아이콘
  body: body wrapper — title + description 묶음
  title: 제목
  description: 설명(선택)
  close: 닫기 버튼(dismissable 만)

variants:
  variant:
    default: 일반 메시지 — 시스템 안내. 의미 분기 없을 때만.
    info: 정보성 안내 — 새 기능, 정책 변경 예고.
    success: 성공 / 완료 — 결제 완료, 작업 성공 후 페이지 안내.
    warning: 주의 / 임박 — 약관 변경 예정, 저장 공간 부족.
    error: (destructive) 실패 / 오류 — 결제 실패, 저장 실패 등. shadcn `destructive` alias.

states: [visible]

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    visible:
      root:
        padding: $spacing-md
        gap: { value: $spacing-md, note: icon ↔ body }
        radius: $radius-sm
        marginBlock: { value: $spacing-sm, note: 인접 alert }
      body:
        gap: { value: $spacing-xs, note: title ↔ description }
      title:
        typography: $text-body-md
        fontWeight: 600
      description:
        typography: $text-body-sm
        foreground: $color-text-secondary
      icon:
        size: { value: 20px, note: svg attr }
      close:
        size: { value: 28px, note: literal }

  # ── 변형별 색 ─────────────────────────────────────────
  - when: { variant: default }
    visible:
      root:
        background: { value: $color-surface-default, note: 그대로 }
      borderLeft:
        color: { value: none, note: 1px border-default }
      icon:
        color: { value: none, note: 또는 중립 }

  - when: { variant: info }
    visible:
      root:
        background: { value: $color-info / 8%, note: "`color-mix(in srgb, info 8%, surface-default)`" }
      borderLeft:
        width: { value: 4px, note: literal — accent strip }
        color: $color-info
      icon:
        color: $color-info

  - when: { variant: success }
    visible:
      root:
        background: { value: $color-success / 8%, note: "`color-mix(in srgb, success 8%, surface-default)`" }
      borderLeft:
        width: { value: 4px, note: literal — accent strip }
        color: $color-success
      icon:
        color: $color-success

  - when: { variant: warning }
    visible:
      root:
        background: { value: $color-warning / 8%, note: "`color-mix(in srgb, warning 8%, surface-default)`" }
      borderLeft:
        width: { value: 4px, note: literal — accent strip }
        color: $color-warning
      icon:
        color: $color-warning

  - when: { variant: error }
    visible:
      root:
        background: { value: $color-error / 8%, note: "`color-mix(in srgb, error 8%, surface-default)`" }
      borderLeft:
        width: { value: 4px, note: literal — accent strip }
        color: $color-error
      icon:
        color: $color-error
