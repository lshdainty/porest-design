# Progress 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 크기는 size 축(#size), 색은 조건 없는 규칙(#base)에 있다. 색 표의 Light · Dark 줄은 { value, dark } 다.
# slots 첫째 부위에 높이가 있으면 크기 표에 터치 칸이 붙는다 — 누르는 요소가 아닌 track 은 둘째에 둔다.

name: Progress

slots:
  indicator: ⓑ indicator — primary 색 채움
  track: ⓐ track — 회색 베이스(Radix Root)

variants:
  size:
    sm: inline (한 줄 안에 끼워)
    md: 표준 — 폼 위, 카드 안
    lg: 큰 작업 (다운로드, 업로드)

defaults:
  size: md

states: [default]

rules:
  - when: {}
    default:
      track:
        background: { value: $color-surface-input, dark: $color-surface-input-dark, note: "다크 — cascade 자동" }
      indicator:
        background: { value: $color-primary, dark: $color-primary-light, note: "(브랜드) — 다크 cascade 자동" }

  - when: { size: sm }
    default:
      track: { height: 2px }

  - when: { size: md }
    default:
      track: { height: 4px }

  - when: { size: lg }
    default:
      track: { height: 8px }
