# Sidebar 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 상태 표가 부위마다 둘이다 — SidebarMenuButton(hover · active …)과 Sidebar 패널(펼침 · 접힘 · 모바일).
#   크기 · 모양     조건 없는 규칙(#base.default).
#   메뉴 버튼 크기  { size } 규칙(#size).
#   메뉴 버튼 상태  { part: menuButton } 규칙(#matrix.part.menuButton) — part 축은 메뉴 버튼 상태 규칙을
#                  크기 표(#base.default)와 가르는 데만 쓴다.
#   패널 상태       sidebar 축(#sidebar). 펼침 · 접힘은 collapsible 모드 · 모바일과 묶여 한 줄씩이라
#                  상태가 아니라 축으로 두고, Sizes 표의 너비 세 줄(--sidebar-width · -icon · -mobile)도 여기에 있다.
# 기본값은 defaults 가 아니라 설명에 둔다 — defaults 에 두면 메뉴 버튼 상태 매트릭스에 크기 · 너비 칸이 섞인다.
# side · variant · collapsible 표(동작 · 사용처)는 sidebar.md 에 있다.

name: Sidebar

slots:
  root: Sidebar 패널
  headerFooter: SidebarHeader · SidebarFooter
  group: SidebarGroup — 메뉴 그룹 wrapper
  groupLabel: SidebarGroupLabel — 그룹 카테고리 헤딩
  menu: SidebarMenu — menu item 묶음(`<ul>`)
  menuButton: SidebarMenuButton — icon + 라벨
  focusRing: 메뉴 버튼 키보드 포커스 링
  trigger: SidebarTrigger — PanelLeft 토글 버튼
  provider: SidebarProvider — context · 단축키

variants:
  size:
    default: ""
    sm: ""
    lg: logo row
  sidebar:
    expanded: (default) — full width, 라벨 가시
    collapsed (offcanvas): 화면 밖
    collapsed (icon): icon만 — tooltip으로 라벨
    mobile: "(`isMobile`) — [`Sheet`](sheet.md) `side={side}` overlay"
  part:
    menuButton: SidebarMenuButton 상태

states:
  default: ""
  hover: ""
  focus-visible: ""
  active: "(`data-[active=true]`)"
  disabled: "(`aria-disabled` / `disabled`)"
  data-state=open: (sub-menu)

rules:
  # ── 크기 · 모양 ───────────────────────────────────────
  - when: {}
    default:
      headerFooter:
        padding: $spacing-sm
      group:
        padding: $spacing-sm
      groupLabel:
        typography: $text-caption
        fontWeight: 600
        color: $color-text-tertiary
        textTransform: uppercase
        letterSpacing: { value: wide, note: "`tracking-wide`" }
      menu:
        gap: $spacing-xs
      menuButton:
        gap: { value: $spacing-sm, note: "icon ↔ label" }
        radius: { value: $radius-sm, note: "menu family 정합" }
        iconSize: { value: 16px, note: "16×16 — `[&>svg]:size-4`" }
      trigger:
        width: 28px
        height: { value: 28px, note: "PanelLeft — [`Button`](button.md) `variant=\"ghost\" size=\"icon\"`" }
      provider:
        shortcut: { value: Ctrl/⌘ + B, note: "Provider 자동 binding" }

  # ── 메뉴 버튼 크기 ────────────────────────────────────
  - when: { size: default }
    default:
      menuButton: { height: 32px, padding: $spacing-sm, typography: $text-body-md }

  - when: { size: sm }
    default:
      menuButton: { height: 28px, typography: $text-label-sm }

  - when: { size: lg }
    default:
      menuButton: { height: 48px, typography: $text-body-md }

  # ── 패널 너비 ─────────────────────────────────────────
  - when: { sidebar: expanded }
    default:
      root: { width: { value: 16rem, note: "256px — `--sidebar-width`" } }

  - when: { sidebar: collapsed (offcanvas) }
    default:
      root: { width: 0 }

  - when: { sidebar: collapsed (icon) }
    default:
      root: { width: { value: 3rem, note: "48px — `--sidebar-width-icon`" } }

  - when: { sidebar: mobile }
    default:
      root: { width: { value: 18rem, note: "288px — `--sidebar-width-mobile`" } }

  # ── 메뉴 버튼 상태 ────────────────────────────────────
  - when: { part: menuButton }
    default:
      menuButton:
        background: transparent
        foreground: $color-text-primary
    hover:
      menuButton:
        background: $color-surface-input
    focus-visible:
      focusRing:
        width: 2px
        color: { value: $color-border-focus, note: "`ring-2 ring-ring` — ring = border-focus(shadcn bridge)" }
    active:
      menuButton:
        background: $color-surface-input
        fontWeight: { value: 500, note: "`font-medium`" }
    disabled:
      menuButton:
        opacity: 0.5
        cursor: { value: not-allowed, note: "`cursor-not-allowed`" }
    data-state=open:
      menuButton:
        background: $color-surface-input

motion:
  colors:
    duration: $motion-duration-fast
    properties: [colors]
  width:
    duration: 200ms
    easing: linear
    properties: [width]
    note: "`transition-[width] duration-200 ease-linear`"
