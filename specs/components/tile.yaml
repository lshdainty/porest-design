# Tile 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 선택 여부(inactive · active)는 hover · focus-visible · disabled 와 곱해지므로 상태가 아니라 축(selected)이다.
# 기본값은 두지 않는다 — 상태 표(#matrix.selected.inactive)에 크기 값이 끼지 않도록. md 가 기본 크기다(설명 칸).
# --border-subtle · --bg-surface · --radius-tile · --fs-* · --fw-semi 는 DESIGN.md 토큰이 아니라
# 앱 쪽 별칭이라 원래 표기 그대로 둔다.

name: Tile

slots:
  root: 타일 카드 — 테두리 · 배경 · 모양, swatch · 텍스트 · check 사이 간격
  swatch: ⓑ 미리보기 — 색 · 아이콘 · 이미지 1개
  label: ⓒ 라벨
  description: ⓒ 설명
  check: ⓓ check (active)
  focusRing: ⓔ 키보드 포커스 링

variants:
  size:
    sm: ""
    md: 기본
    lg: ""
  selected:
    inactive: 선택 안 됨
    active: 선택됨

states: [enabled, hover, focus-visible, disabled]

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      root:
        radius: $radius-lg
        transitionProperty: all
        transitionDuration: $motion-duration-fast
      swatch:
        radius: { value: var(--radius-tile), note: "= radius-lg 12" }
        borderWidth: 1px
        borderColor: var(--border-subtle)
      label:
        fontSize: { value: 14px, note: "`var(--fs-body)`" }
        fontWeight: { value: semi, note: "`var(--fw-semi)`" }
      description:
        fontSize: { value: 11–12px, note: "`var(--fs-caption)`" }
        fontWeight: regular
        foreground: $color-text-tertiary
      check:
        color: $color-primary
    focus-visible:
      focusRing:
        width: 2px
        offset: 2px
        color: { value: $color-border-focus, note: "`ring-2 ring-ring ring-offset-2` — ring = border-focus(shadcn bridge)" }
    disabled:
      root:
        opacity: { value: 0.5, note: "`opacity 0.5 cursor-not-allowed`" }
        cursor: not-allowed

  # ── 크기 ──────────────────────────────────────────────
  - when: { size: sm }
    enabled:
      root: { paddingY: 12px, paddingX: 10px, gap: 10px }
      swatch: { size: 32px }
      check: { size: 14px }

  - when: { size: md }
    enabled:
      root: { paddingY: 16px, paddingX: 14px, gap: { value: $spacing-md, note: "swatch ↔ text" } }
      swatch: { size: 40px }
      check: { size: 16px }

  - when: { size: lg }
    enabled:
      root: { paddingY: 20px, paddingX: 18px, gap: 14px }
      swatch: { size: 48px }
      check: { size: 18px }

  # ── 선택 여부 ─────────────────────────────────────────
  - when: { selected: inactive }
    enabled:
      root:
        borderWidth: 1px
        borderColor: { value: var(--border-subtle), note: "solid" }
        background: var(--bg-surface)
    hover:
      root:
        borderColor: $color-border-default

  - when: { selected: active }
    enabled:
      root:
        borderWidth: 1.5px
        borderColor: { value: $color-primary, note: "solid" }
        background: { value: $color-primary / 8%, note: "`color-mix(in oklch, var(--color-primary) 8%, transparent)` (literal mix)" }
      check:
        visibility: { value: visible, note: "✓" }
