# Form 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 조건 없는 규칙에는 field 상태 표(FormLabel · FormControl · FormMessage)만 둔다 — #matrix.
# form-card 값은 md 의 두 layout(card / inline) 가운데 card 에만 있으므로 layout 축에 둔다 —
# 조건 없는 규칙에 두면 상태 표의 default 값과 섞인다. form-grid 는 화면 폭(viewport)마다 갈린다.
# layout · viewport 에는 기본값을 두지 않는다 — 두면 상태 표(#matrix)에 그 값 칸이 끼어든다.

name: Form

slots:
  root: form 상자 — card layout 에서는 ⓐ form-card
  grid: ⓓ form-grid
  label: ⓑ FormLabel
  control: ⓒ FormControl — Input · Select 등 control 자체
  focusRing: control 포커스 링(control spec)
  message: ⓕ FormMessage

variants:
  layout:
    card: HR 결재 신청 / Desk 메모 metadata
    inline: login / search — card 상자 없음
  viewport:
    desktop: "≥ md (768px)"
    mobile: "< md"

states: [default, focus, error, disabled, readonly]

rules:
  # ── field 상태 ────────────────────────────────────────
  - when: {}
    default:
      label:
        foreground: $color-text-primary
      control:
        borderColor: $color-border-default
        aria-invalid: "false"
      message:
        visibility: hidden
    focus:
      control:
        borderColor: { value: $color-border-focus, note: control spec }
      focusRing:
        width: { value: 2px, note: "ring 2px (control spec)" }
    error:
      label:
        foreground: { value: $color-error, note: "`data-[error=true]:text-error`" }
      control:
        borderColor: { value: $color-error, note: "`border-error` (control spec)" }
        aria-invalid: "true"
      message:
        visibility: visible
    disabled:
      label:
        opacity: { value: 0.7, note: "`peer-disabled:opacity-70`" }
      control:
        opacity: 0.5
    readonly:
      control:
        foreground: $color-text-secondary
        cursor: { value: not-allowed, note: "`cursor-not-allowed`" }

  # ── Card layout (form-card) ───────────────────────────
  - when: { layout: card }
    default:
      root:
        background: $color-surface-default
        radius: $radius-lg
        padding: $spacing-2xl
        shadow: $shadow-sm
        maxWidth: 640px
        flexDirection: { value: column, note: flex column }
        gap: { value: $spacing-xl, note: group 사이 }

  # ── Grid (form-grid) ──────────────────────────────────
  - when: { viewport: desktop }
    default:
      grid:
        columns: 2
        rowGap: $spacing-lg
        columnGap: $spacing-xl

  - when: { viewport: mobile }
    default:
      grid:
        columns: 1
        gap: $spacing-lg
