# Carousel 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 방향(orientation)에 따라 슬라이드 간격을 내는 방식과 화살표 자리가 갈린다. 한 화면에 여러 장을
# 보이는 multi-item 은 슬라이드 너비만 바꾸므로 items 축으로 둔다.
# 슬라이드 위치별 화살표 enabled/disabled 는 carousel.md States 표(동작)에 있다.

name: Carousel

slots:
  root: Carousel root — `role="region"` 상자
  content: CarouselContent — 슬라이드 flex container
  slide: CarouselItem — 슬라이드 하나
  arrow: CarouselPrevious · CarouselNext 화살표 버튼
  dot: Dot indicator (옵션) — 사용처 합성

variants:
  orientation: [horizontal, vertical]
  items:
    single: ""
    multi-item: 3개

defaults:
  orientation: horizontal
  items: single

states: [default]

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    default:
      root:
        width: { value: 사용처 결정, note: "`max-w-*` / `w-full`" }
      arrow:
        width: { value: 32px, note: "Button icon보다 작음, carousel 보조 navigation 톤" }
        height: 32px
        radius: $radius-full
        iconSize: { value: 16px, note: "`ArrowLeft`/`ArrowRight`" }
      dot:
        width: { value: 6px, note: "Dot indicator (옵션)" }
        height: 6px
        radius: $radius-full

  # ── 방향 ──────────────────────────────────────────────
  - when: { orientation: horizontal }
    default:
      content:
        gap: { value: $spacing-lg, note: "`-ml-[var(--spacing-lg)]` (content) + `pl-[var(--spacing-lg)]` (item) — negative margin trick" }
      arrow:
        position: { value: -48px, note: "외부 — `-left-12` / `-right-12` + `top-1/2 -translate-y-1/2`" }

  - when: { orientation: vertical }
    default:
      content:
        gap: { value: $spacing-lg, note: "`-mt-[var(--spacing-lg)]` + `pt-[var(--spacing-lg)]`" }
      arrow:
        position: { value: -48px, note: "외부 — `-top-12` / `-bottom-12` + `left-1/2 -translate-x-1/2` + `rotate-90`" }

  # ── 슬라이드 너비 ─────────────────────────────────────
  - when: { items: single }
    default:
      slide:
        basis: { value: full width, note: "`basis-full`" }

  - when: { items: multi-item }
    default:
      slide:
        basis: { value: 1/3 width, note: "`basis-1/3` (사용처 className)" }
