# Swipe Actions 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 색은 원형 배지만 갖는다(kind 규칙). 밝기 · 불투명도 · 커서 · 포커스 링은 액션 버튼(한 칸) 전체에 걸린다.
# 크기는 단일 사이즈(size: default)다. kind · size 에 기본값을 두지 않아 상태 표(#matrix)에는
# 상태마다 바뀌는 공통 값만 보인다 — 상태와 상관없는 공통 값은 #base.enabled.

name: Swipe Actions

slots:
  row: ⓐ 감싸는 리스트 행 — 스펙이 내부를 정의하지 않는다
  track: ⓑ 행 뒤에 드러나는 영역 — 배경을 칠하지 않는다
  action: ⓒ 액션 한 칸(버튼) — 원형 배지 + 그 아래 라벨, 세로 가운데. 터치 대상은 이 칸 전체
  badge: 원형 배지 — 색은 여기만
  icon: 배지 안 아이콘
  label: 배지 아래 라벨
  focusRing: 키보드 포커스 링

variants:
  kind:
    neutral: 부수 동작 — 고정, 보관, 공유
    primary: 주 동작 — 수정
    destructive: 되돌리기 어려움 — 삭제
  size: [default]

states:
  enabled: ""
  hovered: ""
  focused: (visible)
  pressed: (active)
  disabled: ""

rules:
  # ── 상태(공통) ────────────────────────────────────────
  - when: {}
    enabled:
      badge:
        background: { value: kind 색, note: "배경은 배지에만 있다 — kind 별 값은 Kinds 표" }
      action:
        brightness: 100%
        shadow: none
        transform: translateX(0)
        cursor: pointer
    hovered:
      action: { brightness: 92% }
    focused:
      focusRing:
        width: 2px
        color: { value: $color-border-focus, note: "inset — `2px var(--color-border-focus)`" }
    pressed:
      action: { brightness: 88% }
    disabled:
      action:
        opacity: 0.4
        cursor: not-allowed

  # ── 종류별 색 ─────────────────────────────────────────
  - when: { kind: neutral }
    enabled:
      badge: { background: $color-surface-input }
      icon: { color: $color-text-primary }
      label: { color: $color-text-secondary }

  - when: { kind: primary }
    enabled:
      badge: { background: $color-info }
      icon: { color: $color-text-on-accent }
      label: { color: $color-text-secondary }

  - when: { kind: destructive }
    enabled:
      badge: { background: $color-error }
      icon: { color: $color-text-on-accent }
      label: { color: { value: $color-error, dark: $color-error-light } }

  # ── 크기(단일) ────────────────────────────────────────
  - when: { size: default }
    enabled:
      action:
        height: { value: 행 높이, note: "min 56" }
        width: { value: 배지 + 앞 간격, note: "첫 액션 56, 이후 48" }
        paddingY: 0
        paddingX: 앞 간격만
        touchTarget: { value: ✅ · ✅, note: "AA · AAA" }
      badge:
        size: 36px
        radius: { value: $radius-full, note: "원형" }
      icon:
        size: 18px
      label:
        typography: { value: $text-caption, note: "font-size(12)만 토큰 그대로 — 굵기 · 줄 높이는 이 컴포넌트 override(12 / 600 / 1.3)" }
        fontWeight: 600
        lineHeight: 1.3
