# Textarea 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# variant 없음, 크기는 하나(min-h-20 + rows 가변) — 예외는 사용처 className 으로(textarea.md Sizes).
# 시각 톤은 Input 과 1:1 — 글자만 body-md.

name: Textarea

slots:
  root: 입력 상자(container) — 채움 · 외곽선 · 모양, 입력값 글자
  placeholder: placeholder 글자
  focusRing: 키보드 포커스 링(focus-visible 한정)

variants: {}

states:
  enabled: ""
  hover: ""
  focus-visible: ""
  error: '(`aria-invalid="true"`)'
  disabled: ""
  readonly: ""

rules:
  - when: {}
    enabled:
      root:
        minHeight: 80px
        paddingY: $spacing-sm
        paddingX: $spacing-md
        typography: { value: $text-body-md, note: "line-height 1.6는 preview/spec 명시" }
        radius: $radius-sm
        borderWidth: 1px
        borderColor: $color-border-default
        background: $color-surface-input
        resize: { value: vertical, note: "기본 / none (opt-out) — `resize-y` / `resize-none`" }
        width: 100%
        foreground: $color-text-primary
        cursor: text
      placeholder:
        foreground: $color-text-tertiary
    hover:
      root:
        foreground: { value: $color-text-primary, note: "변화 없음" }
    focus-visible:
      root:
        borderColor: { value: $color-border-focus, note: "`border-ring` — ring = border-focus(shadcn bridge)" }
      focusRing:
        width: 2px
        color: { value: $color-border-focus / 30%, note: "`ring-2 ring-ring/30`" }
    error:
      root:
        borderColor: $color-error
      focusRing:
        width: 2px
        color: { value: $color-error / 30%, note: "`ring-2 ring-error/30`" }
    disabled:
      root:
        opacity: { value: 0.5, note: "배경 · 글자 모두" }
        cursor: not-allowed
    readonly:
      root:
        foreground: $color-text-secondary
        cursor: { value: not-allowed, note: "또는 `default`" }
