# Tooltip 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 상태는 content 의 한살이다. 기본 상태는 closed(default) — 크기 · 색은 여기 두고, 열리면 그대로 보인다.
# hover 이탈로 닫히는 줄도 원래 표에서 closed 라 이름에 괄호를 붙여 기본 closed 와 가른다.
# variant · size 없음(tooltip.md Variants · Sizes).

name: Tooltip

slots:
  content: ⓐ content — 도움말 상자

variants: {}

states:
  closed: (default) — (unmounted)
  delay-open: (hover/focus 직후 200ms 대기) — (still closed)
  open: content portal 마운트 + fade-in zoom-in
  closed (hover 이탈): content unmount + fade-out zoom-out

rules:
  - when: {}
    closed:
      content:
        paddingY: $spacing-xs
        paddingX: $spacing-md
        radius: $radius-xs
        background: { value: $color-text-primary, note: "페이지와 inverse" }
        foreground: { value: $color-surface-default, note: "bg와 inverse" }
        borderColor: { value: none, note: "강한 대비로 식별 충분" }
        # 옮기기 전 표는 13 / 500 이라 적었다. text-label-sm 토큰의 굵기는 400 — 값은 고치지 않았다.
        typography: { value: $text-label-sm, note: "옮기기 전 표기 13 / 500 — 토큰 값과 다르다" }
        shadow: { value: $shadow-sm, note: "가볍게" }
        sideOffset: { value: 4px, note: "Radix `sideOffset={4}` 기본" }
        # Anatomy ⓐ 는 z-[210](z-index.md L4)이라 적었다 — 값은 고치지 않았다.
        zIndex: { value: 50, note: "literal" }
    open:
      content:
        animation: "data-[state=open]:animate-in fade-in-0 zoom-in-95"
    closed (hover 이탈):
      content:
        animation: "data-[state=closed]:animate-out fade-out-0 zoom-out-95"
