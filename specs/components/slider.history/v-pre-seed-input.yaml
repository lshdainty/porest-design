# Slider 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# size variant 가 없다(폭은 사용처 className). mode(single · range)는 thumb 수와 fill 범위만 달라
# 시각 값이 같으므로 축으로 두지 않는다(slider.md Variants (mode)).
# 크기 · 색은 enabled 의 조건 없는 규칙(#base.enabled), 상태 표는 #matrix.

name: Slider

slots:
  root: Slider 전체 — 터치 영역
  track: 트랙
  fill: 채움(시작점 → thumb, range 는 두 thumb 사이)
  thumb: 손잡이
  focusRing: thumb 키보드 포커스 링

variants: {}

states:
  enabled: ""
  hover: (thumb)
  focus-visible: (thumb)
  active / dragging: ""
  disabled: ""

rules:
  - when: {}
    enabled:
      track:
        height: 4px
        radius: $radius-full
        background: $color-surface-input
      fill:
        background: $color-primary
      thumb:
        width: 16px
        height: 16px
        background: { value: $color-text-on-accent, note: "#FFFFFF 고정" }
        borderWidth: 2px
        borderStyle: solid
        borderColor: $color-primary
        shadow: $shadow-sm
      root:
        paddingY: { value: $spacing-sm, note: "touch area" }
    hover:
      thumb:
        cursor: grab
    focus-visible:
      focusRing:
        width: 2px
        offset: 2px
        color: { value: $color-border-focus, note: "`ring-2 ring-ring ring-offset-2` — ring = border-focus(shadcn bridge)" }
    active / dragging:
      thumb:
        cursor: grabbing
    disabled:
      track:
        background: { value: $color-surface-input, note: "opacity 0.5" }
      fill:
        background: { value: $color-primary, note: "opacity 0.5" }
      thumb:
        opacity: 0.5
        pointerEvents: { value: none, note: "`pointer-events-none`" }
