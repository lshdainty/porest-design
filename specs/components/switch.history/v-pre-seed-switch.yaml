# Switch 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 켬 · 끔(checked)은 hover · focus-visible · disabled 와 곱해지므로 상태가 아니라 축이다.
# 켬 · 끔에 따라 바뀌는 값(track 배경 · thumb 위치)은 { checked } 규칙, 나머지는 공통 규칙에 있다.
# checked 에는 기본값을 두지 않는다 — 상태 표(#matrix)가 켬 · 끔과 상관없이 상태마다 바뀌는 값만 보이도록.

name: Switch

slots:
  track: ⓐ root(track) — 스위치 본체. 2px transparent border 는 focus ring inset 공간
  thumb: ⓑ 흰 원 — 켬 · 끔에 따라 좌우로 움직인다
  focusRing: ⓒ 키보드 포커스 링(focus-visible 한정)

variants:
  checked:
    unchecked: 끔 — `data-state=unchecked`
    checked: 켬 — `data-state=checked`

states: [enabled, hover, focus-visible, disabled]

rules:
  # ── 크기 · 모양 · 색(공통) ─────────────────────────────
  - when: {}
    enabled:
      track:
        width: 44px
        height: 24px
        radius: $radius-full
        borderWidth: 2px
        borderColor: { value: transparent, note: "focus inset" }
      thumb:
        size: 20px
        radius: $radius-full
        background: { value: $color-text-on-accent, note: "#FFFFFF 고정" }
        shadow: $shadow-md
    focus-visible:
      focusRing:
        width: 2px
        offset: 2px
        color: { value: $color-border-focus, note: "`ring-2 ring-ring ring-offset-2` — ring = border-focus(shadcn bridge)" }
    disabled:
      track:
        opacity: 0.5
        cursor: not-allowed

  # ── 커서 · 전환(공통) ─────────────────────────────────
  - when: {}
    enabled:
      track:
        cursor: pointer
        transitionProperty: bg-color / transform
        transitionDuration: $motion-duration-fast
        transitionEasing: $motion-ease-out

  # ── 켬 · 끔 ───────────────────────────────────────────
  - when: { checked: unchecked }
    enabled:
      track: { background: $color-border-strong }
      thumb: { translateX: { value: 0, note: "`translate-x-0` (좌측)" } }

  - when: { checked: checked }
    enabled:
      track: { background: $color-primary }
      thumb: { translateX: { value: 20px, note: "`translate-x-5` (우측)" } }
