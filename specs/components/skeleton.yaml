# Skeleton 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# size variant · state 가 없다(모양은 사용처 className). 색 · 모양은 조건 없는 규칙(#base),
# 애니메이션 시간 · 곡선은 motion(#motion)에 있다. animation variant(pulse · shimmer)의
# 시각 · 사용처는 skeleton.md 의 Variants (animation) 표에 있다.

name: Skeleton

slots:
  root: placeholder 박스
  shimmer: shimmer variant 의 자식 gradient overlay

variants: {}

states: [default]

rules:
  - when: {}
    default:
      root:
        background: $color-surface-input
        radius: { value: $radius-sm, note: "base" }
      shimmer:
        gradient: { value: $color-primary / 25%, note: "`from-transparent via-primary/25 to-transparent` (또는 `color-mix(in srgb, var(--color-primary) 25%, transparent)`)" }

motion:
  pulse:
    duration: 2s
    note: "Tailwind 기본 — `animate-pulse`"
  shimmer:
    duration: $motion-duration-loop
    easing: linear
