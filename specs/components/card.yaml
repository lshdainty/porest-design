# Card 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# border-subtle · bg-muted · bg-brand-subtle · border-brand 는 DESIGN.md 토큰이 아니라서
# `$` 없이 스펙 표기 그대로 적는다(recipe 는 `var(--bg-muted)` 처럼 CSS 변수로 인용).
# 여백은 화면 폭에 따라 갈리므로 viewport 축에 있다. 상태 표는 shadow 변형 기준이다.

name: Card

slots:
  root: 카드 상자(container) — 배경 · 테두리 · 그림자 · 모양
  area: 모든 영역 — CardHeader · CardContent · CardFooter
  header: CardHeader — title · description 을 세로로 쌓는다
  focusRing: 키보드 포커스 링(interactive Card)

variants:
  variant:
    shadow: 정보 카드 (dashboard widget, list item, detail panel). spec 기본 — Toss 절제 톤.
    bordered: dense info / secondary 강조 (선택 기간 카드, hint box, inline summary). shadow 없이 1px line 으로 식별 — 카드 안 카드 (nested) 시각 위계 회피 + chart dense card 가독성.
    muted: sunken 톤 info 박스 (다이얼로그/시트 위 inline summary, day-detail 합계, 스포트라이트). bordered 가 surface 와 묻혀 안 보이는 어두운/시트 배경에서 fill 로 식별. App `PCard.muted` 정합.
    brand: 브랜드 틴트 강조 카드 (selected/active, '현재 플랜' 배너, 추천 플랜). 브랜드색 8~12% 틴트 + brand 보더로 시각 강조. App `PCard.brand` 정합.
  viewport:
    mobile: "< 768px"
    desktop: "≥ 768px"

defaults:
  variant: shadow

states:
  default: ""
  hover: (interactive Card만)
  disabled: (interactive Card만)
  focus-visible: (interactive Card만) — 위 상태 유지 + 링

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    default:
      root:
        radius: $radius-lg
      header:
        gap: { value: $spacing-xs, note: "Section gap — header 내 title-description" }
    disabled:
      root:
        opacity: 0.5
    focus-visible:
      focusRing:
        width: 2px
        offset: 2px
        color: { value: $color-border-focus, note: "`ring-2 ring-ring ring-offset-2` — ring = border-focus(shadcn bridge)" }

  # ── 화면 폭별 여백 ────────────────────────────────────
  - when: { viewport: mobile }
    default:
      area:
        padding: { value: $spacing-lg, note: "모든 영역" }

  - when: { viewport: desktop }
    default:
      area:
        padding: { value: $spacing-xl, note: "모든 영역" }

  # ── 변형별 배경 · 테두리 · 그림자 ─────────────────────
  - when: { variant: shadow }
    default:
      root:
        background: $color-surface-default
        borderColor: none
        shadow: $shadow-sm
    hover:
      root:
        shadow: $shadow-md

  - when: { variant: bordered }
    default:
      root:
        background: $color-surface-default
        borderColor: border-subtle
        borderWidth: 1px
        shadow: none

  - when: { variant: muted }
    default:
      root:
        background: { value: bg-muted, note: "#F0F2F7 / dark #2D3346" }
        borderColor: none
        shadow: none

  - when: { variant: brand }
    default:
      root:
        background: { value: bg-brand-subtle, note: "primary 8% / dark 12%" }
        borderColor: border-brand
        borderWidth: 1px
        shadow: none
