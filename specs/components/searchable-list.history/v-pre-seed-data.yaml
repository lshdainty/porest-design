# SearchableList 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 선택 여부(active · inactive)는 focus-visible · disabled 와 곱해지므로 상태가 아니라 축(selected)이다.
# 크기마다 다른 값(행 여백 · 썸네일 · 간격 · 목록 최대 높이)은 { size } 규칙, 크기와 상관없는 값은
# 조건 없는 규칙, 선택 여부에 따라 다른 값(행 배경 · 주제목 색·굵기)은 { selected } 규칙에 있다.
#
# 기본 크기 md 는 defaults 가 아니라 size 설명에 둔다 — defaults 에 두면 상태 매트릭스(#matrix)에
# 크기 값이 칸으로 섞인다(Button 처럼 size 기본값 없이 둔다).
#
# DESIGN 토큰이 없는 이름(`border-subtle` · `var(--bg-surface)` · `var(--bg-brand-subtle)` ·
# `var(--color-primary-strong)`)은 스펙 표기 그대로 값에 둔다.

name: SearchableList

slots:
  searchInput: 상단 검색 input
  searchIcon: 검색 input 좌측 Search 아이콘
  container: 결과 목록 상자 — 테두리 · 모양 · 배경 · 최대 높이(스크롤)
  row: 결과 행 — 여백 · 구분선 · 배경, thumbnail ↔ 텍스트 간격
  thumbnail: 좌측 썸네일(card) — 이미지 · swatch
  title: 주제목
  subtitle: 부제목
  emptyState: 결과 0건 안내("검색 결과가 없어요")
  focusRing: 키보드 포커스 링(각 row inner)

variants:
  size:
    sm: ""
    md: 기본
    lg: ""
  selected:
    inactive: 선택 안 됨
    active: 선택됨

defaults:
  selected: inactive

states:
  enabled: ""
  hover: (inactive)
  focus-visible: ""
  disabled: (단종/비활성)

rules:
  # ── 공통(크기 · 선택과 상관없음) ───────────────────────
  - when: {}
    enabled:
      searchInput:
        tone: { value: input-md 톤, note: "input spec" }
        paddingLeft: 36px
      searchIcon:
        size: 14px
        color: $color-text-tertiary
      container:
        borderWidth: 1px
        borderColor: { value: border-subtle, note: "`var(--color-border-subtle)`" }
        radius: { value: 6px, note: "`var(--radius-md)`" }
        background: var(--bg-surface)
      row:
        dividerWidth: 1px
        dividerColor: border-subtle
        cursor: pointer
      thumbnail:
        radius: $radius-sm
      title:
        fontSize: 13px
      subtitle:
        fontSize: 11.5px
        fontWeight: regular
        color: $color-text-tertiary
      emptyState:
        paddingY: 24px
        fontSize: 12px
        color: $color-text-tertiary
    focus-visible:
      focusRing:
        width: 2px
        offset: 2px
        color: { value: $color-border-focus, note: "`ring-2 ring-ring ring-offset-2` — ring = border-focus(shadcn bridge)" }
    disabled:
      row:
        opacity: { value: 0.7, note: "`opacity 0.7` + badge 표시" }

  # ── 크기 ──────────────────────────────────────────────
  - when: { size: sm }
    enabled:
      container: { maxHeight: 200px }
      row: { paddingY: 8px, paddingX: 12px, gap: 10px }
      thumbnail: { width: 32px, height: 20px }

  - when: { size: md }
    enabled:
      container: { maxHeight: 260px }
      row: { paddingY: 10px, paddingX: 12px, gap: { value: $spacing-md, note: "thumb ↔ text" } }
      thumbnail: { width: 44px, height: 28px }

  - when: { size: lg }
    enabled:
      container: { maxHeight: 320px }
      row: { paddingY: 14px, paddingX: 16px, gap: 14px }
      thumbnail: { width: 56px, height: 36px }

  # ── 선택 여부 ─────────────────────────────────────────
  - when: { selected: inactive }
    enabled:
      row: { background: transparent }
      title: { color: $color-text-primary, fontWeight: medium }
    hover:
      row: { background: { value: $color-surface-input, note: "subtle" } }

  - when: { selected: active }
    enabled:
      row: { background: var(--bg-brand-subtle) }
      title:
        color: { value: var(--color-primary-strong), note: "또는 `var(--color-primary)` 환경에 맞춰" }
        fontWeight: semi
