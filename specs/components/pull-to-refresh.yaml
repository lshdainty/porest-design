# 당겨서 새로 고침의 수치 원본 — SEED Pull To Refresh(react-pull-to-refresh 2.1.0, 디자인 문서는 없다 — 2026-10-03 사용자 결정,
# 비교 페이지 8 · 14). 문서는 progress-circle.md 의 "당겨서 새로 고침" 절. 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 앱 화면(탭)의 목록 · 대시보드를 맨 위에서 아래로 당겨 같은 내용을 다시 받는다. 지시자는 원판 없는 Progress Circle 24(neutral) —
# 당기는 동안 당긴 만큼 채우다가(값 있는 원) 문턱을 넘겨 놓으면 돈다(값 없는 원). 내용은 새로 고침이 끝날 때까지 88 에 머문다.
# 웹은 두지 않는다 — 폰 브라우저는 당기면 페이지를 다시 연다.
#
# SEED 와 다른 자리(progress-circle.md 의 "SEED 와 다른 점")
#   - 쉬는 동안 · 당기는 동안 지시자를 보조 기술에 숨긴다 — SEED 는 안 보이는 원이 "0 percent" 로 읽힌다.
#   - 모션 줄이기면 내용이 미끄러지지 않고 바로 제자리로 간다(v104 — SEED 는 그대로 300ms).
#   - 돌아가는 곡선은 motion-ease-enter — SEED 는 정하지 않았다(CSS 기본 ease).

name: PullToRefresh

slots:
  root: 스크롤 영역 — 맨 위에 있을 때 아래로 당기면 시작한다
  indicator: 지시자 칸 — 영역 맨 위(머리 바로 아래)에 내용과 겹친다, 원판 없음
  circle: 원 — Progress Circle 24 · neutral
  content: 내용 — 당긴 만큼 내려온다

variants: {}

states:
  idle: 쉼 — 지시자는 안 보이고 보조 기술에도 숨는다
  pulling: 당기는 중 — 원이 당긴 비율만큼 채워지고 짙어진다
  ready: 문턱을 넘음 — 원이 꽉 찬 채, 놓으면 새로 고친다
  refreshing: 새로 고치는 중 — 원이 돌고 내용은 88 에 머문다

rules:
  - when: {}
    idle:
      root:
        threshold: { value: 88px, note: "당긴 거리가 88 을 넘으면 문턱 — 손가락으로 약 117" }
        multiplier: { value: "0.75", note: "당긴 거리 = 손가락 이동 × 0.75. 처음 아래로 움직인 자리부터 세고, 위로 되돌리면 0 에 머문다" }
      indicator:
        height: { value: 88px, note: "원 24 + 위아래 32 — 누르기는 받지 않는다" }
        translateY: { value: −88px, note: "칸 높이만큼 위 — 머리 뒤로 숨는다" }
        opacity: 0
      circle:
        size: { value: 24px, note: "Progress Circle 24 · neutral · 원판 없음" }
      content:
        translateY: 0px
    pulling:
      indicator:
        translateY: { value: "min(당긴 거리 − 88, 0)", note: "지시자 칸이 내려오다 문턱에서 제자리에 선다" }
        opacity: { value: 당긴 거리 ÷ 88, note: "0 → 1" }
      circle:
        mode: { value: determinate, note: "값 = 당긴 거리 ÷ 88 × 100(0 → 100)" }
      content:
        translateY: { value: 당긴 거리, note: "상한 없음 — 손가락을 따라온다" }
    ready:
      indicator:
        translateY: { value: 0px, note: "제자리 — 더 당겨도 내려오지 않는다" }
        opacity: 1
      circle:
        mode: { value: determinate, note: "값 100 — 꽉 찬 원" }
      content:
        translateY: { value: 당긴 거리, note: "88 을 넘어서도 손가락을 따라온다" }
    refreshing:
      indicator:
        translateY: 0px
        opacity: 1
      circle:
        mode: { value: indeterminate, note: "돈다 — 이름 \"새로 고치는 중\"" }
      content:
        translateY: { value: 88px, note: "새로 고침이 끝날 때까지(성공 · 실패 모두) 머문다 — 그동안 끌기는 받지 않는다" }

motion:
  "놓음 — 88 로":
    duration: $motion-duration-d6
    easing: $motion-ease-enter
    properties: [translateY → 88]
    note: "문턱을 넘겨 놓으면 — 모션 줄이기면 바로"
  "끝남 — 제자리로":
    duration: $motion-duration-d6
    easing: $motion-ease-enter
    properties: [translateY → 0]
    note: "새로 고침이 끝나면 지시자와 함께 — 모션 줄이기면 바로"
  "문턱 전 놓음":
    duration: $motion-duration-d6
    easing: $motion-ease-enter
    properties: [translateY → 0]
    note: "새로 고치지 않는다 — 모션 줄이기면 바로"
