# Table 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 상태는 행(TableRow)의 상태다(default · hover · selected). 정렬 헤더(sort)와 일괄 작업 바(bulk)는
# 행 상태와 따로 움직이므로 축으로 둔다 — 기본값을 두지 않아 행 상태 표(#matrix)에 끼지 않는다.
# 공통 규칙을 둘로 나눈 건 크기 표(#base)의 줄 순서를 원래 표대로 두기 위해서다.

name: Table

slots:
  head: ⓓ TableHead `<th>`
  header: ⓒ TableHeader `<thead>`
  cell: ⓔ TableCell `<td>`
  row: ⓕ TableRow `<tr>`
  footer: ⓖ TableFooter `<tfoot>` — 합계/요약 row
  caption: ⓗ TableCaption `<caption>`
  selectColumn: ⓙ Selection column — Checkbox
  sortHeader: 정렬 가능한 헤더 — Button ghost sm wrap + 화살표
  sortIcon: 정렬 화살표 icon
  bulkBar: ⓐ bulk action bar — 사용처 합성
  numericCell: 숫자 cell

variants:
  sort:
    inactive: sortable header
    active: sortable header (asc/desc)
  bulk:
    hidden: selection 0
    visible: selection ≥ 1

states:
  default: (row)
  hover: (row)
  selected: (`data-[state=selected]`)

rules:
  # ── 헤더 · 셀 · 행 ────────────────────────────────────
  - when: {}
    default:
      head:
        height: 40px
        paddingX: $spacing-sm
        typography: $text-caption
        fontWeight: 600
        foreground: $color-text-tertiary
        textTransform: uppercase
        letterSpacing: tracking-wide
      header:
        background: { value: $color-bg-page, note: "다크모드 자동 swap" }
      cell:
        padding: $spacing-sm
        typography: $text-body-md
        foreground: $color-text-primary
      row:
        borderBottomWidth: 1px
        borderBottomColor: $color-border-default
        background: transparent
    hover:
      row:
        background: $color-surface-input / 50%
    selected:
      row:
        background: $color-surface-input

  # ── 푸터 · 캡션 · 전환 · 부속 ─────────────────────────
  - when: {}
    default:
      footer:
        background: $color-surface-input / 50%
      caption:
        marginTop: $spacing-md
        typography: $text-body-sm
        foreground: $color-text-secondary
      row:
        transitionProperty: colors
        transitionDuration: $motion-duration-fast
        transitionEasing: $motion-ease-out
      selectColumn:
        width: 48px
      sortIcon:
        size: { value: 16px, note: "16×16 — lucide `ArrowUp`/`ArrowDown`/`ArrowUpDown`" }
      bulkBar:
        background: { value: $color-primary / 10%, note: "primary 10% mix — `color-mix(in srgb, var(--color-primary) 10%, transparent)`" }
        radius: $radius-sm
        paddingX: $spacing-md
        paddingY: $spacing-xs
      numericCell:
        fontVariantNumeric: tabular-nums
        textAlign: { value: right, note: "우측 — `text-right font-mono tabular-nums`" }

  # ── 정렬 헤더 ─────────────────────────────────────────
  - when: { sort: inactive }
    default:
      sortHeader:
        background: transparent
        foreground: { value: $color-text-secondary, note: "+ ↑↓ hint on hover" }

  - when: { sort: active }
    default:
      sortHeader:
        background: transparent
        foreground: { value: $color-text-primary, note: "+ ↑ 또는 ↓ 노출" }

  # ── 일괄 작업 바 ──────────────────────────────────────
  - when: { bulk: hidden }
    default:
      bulkBar:
        mount: unmount

  - when: { bulk: visible }
    default:
      bulkBar:
        foreground: { value: $color-primary, note: "primary text" }
