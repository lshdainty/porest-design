# IconPicker 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# md 의 크기 표 둘 — 크기별(trigger · popover · cell)과 md 상세(값 (md)) — 은 붙어 있어 한 표
# (#grid.size)로 그린다. md 상세에만 있는 값(모서리 · 테두리 · 여백 · 간격 · 최대 높이 · 전환 등)은
# md 규칙에만 둔다 — sm · lg 의 값은 md 가 적지 않았으므로 지어내지 않는다(표에서 —).
# 선택 여부(active · inactive)는 hover · focus 와 곱해지므로 상태가 아니라 축(selected)이다(tabs 와 같다).
# 포커스 링은 두 selected 규칙에 같은 값으로 둔다 — #states.selected 에 focus-visible 칸이 나오게.

name: IconPicker

slots:
  trigger: ⓐ trigger — 현재 아이콘 미리보기 버튼
  popover: ⓑ popover content
  search: ⓒ search input
  grid: ⓓ grid
  cell: grid cell — 아이콘 버튼
  focusRing: 키보드 포커스 링

variants:
  size: [sm, md, lg]
  selected:
    inactive: 선택 안 됨
    active: 선택됨(현재 value)

defaults:
  size: md
  selected: inactive

states:
  enabled: ""
  hover: (inactive)
  focus-visible: ""

rules:
  # ── 크기 ──────────────────────────────────────────────
  - when: { size: sm }
    enabled:
      trigger:
        height: 32px
        width: 32px
      popover:
        width: 288px
      grid:
        columns: 8
      cell:
        height: 28px
        width: 28px

  - when: { size: md }
    enabled:
      trigger:
        height: { value: 40px, note: input height 정합 }
        width: 40px
        radius: $radius-md
        borderWidth: 1px
        borderColor: $color-border-default
        shadow: $shadow-sm
      popover:
        width: 320px
        padding: $spacing-md
        transitionProperty: { value: fade + scale, note: popover 기본 }
        transitionDuration: $motion-duration-fast
      search:
        size: { value: input-sm 톤, note: input spec }
      grid:
        columns: 8
        gap: { value: $spacing-xs, note: cell 사이 }
        maxHeight: 240px
      cell:
        height: 32px
        width: 32px
        radius: $radius-sm

  - when: { size: lg }
    enabled:
      trigger:
        height: 48px
        width: 48px
      popover:
        width: 384px
      grid:
        columns: 8
      cell:
        height: 36px
        width: 36px

  # ── cell 상태 ─────────────────────────────────────────
  - when: { selected: inactive }
    enabled:
      cell:
        background: transparent
        foreground: $color-text-secondary
    hover:
      cell:
        background: $color-surface-input
        foreground: $color-text-primary
    focus-visible:
      focusRing:
        width: 2px
        offset: 2px
        color: { value: $color-border-focus, note: "`ring-2 ring-ring ring-offset-2` — ring = border-focus(shadcn bridge)" }

  - when: { selected: active }
    enabled:
      cell:
        background: $color-primary
        foreground: $color-text-on-accent
    focus-visible:
      focusRing:
        width: 2px
        offset: 2px
        color: { value: $color-border-focus, note: "`ring-2 ring-ring ring-offset-2` — ring = border-focus(shadcn bridge)" }
