# Aspect Ratio 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 박스 자체는 스타일 0 — 비율만 정한다. 배경 · 모서리 · object-fit 은 자식(또는 wrapper)이 맡는다.
# ratio 축은 권장 비율이다. `ratio` prop 은 number 라 이 밖의 비율도 쓸 수 있다(aspect-ratio.md Variants).

name: AspectRatio

slots:
  root: AspectRatio 박스(Radix `AspectRatioPrimitive.Root`) — 비율만, 스타일 0
  child: 자식(img · video · iframe · placeholder) — `inset:0` 으로 박스를 채운다

variants:
  ratio:
    "16:9": 동영상, 와이드 미디어, hero banner.
    "4:3": 전통적 사진, 데스크탑 모니터 비율.
    "1:1": 정사각형 — 프로필, 썸네일, square art.
    "3:4": 세로 포트레이트, 모바일 image.
    "21:9": 시네마틱 와이드, dashboard 그래프.
    "2:1": banner, hero (덜 와이드).

states: [default]

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    default:
      root:
        width: { value: 100%, note: "부모 — 자동, 부모에서 `max-w-*` 결정" }
        height: { value: width / ratio, note: 자동 계산 }
      child:
        background: { value: $color-surface-input, note: placeholder — 자식이 결정 }
        radius: { value: $radius-md, note: "또는 `radius-lg` — 사용처, 자식 또는 wrapper에서" }
        objectFit: { value: cover / contain, note: "img — `cover` 잘림 / `contain` 여백" }

  # ── 권장 비율 ─────────────────────────────────────────
  - when: { ratio: "16:9" }
    default:
      root: { aspectRatio: { value: 16 / 9, note: ≈1.78 } }

  - when: { ratio: "4:3" }
    default:
      root: { aspectRatio: { value: 4 / 3, note: ≈1.33 } }

  - when: { ratio: "1:1" }
    default:
      root: { aspectRatio: 1 }

  - when: { ratio: "3:4" }
    default:
      root: { aspectRatio: { value: 3 / 4, note: "0.75" } }

  - when: { ratio: "21:9" }
    default:
      root: { aspectRatio: { value: 21 / 9, note: ≈2.33 } }

  - when: { ratio: "2:1" }
    default:
      root: { aspectRatio: 2 }
