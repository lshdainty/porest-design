# Sonner 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 상태는 토스트의 한살이(visible · enter · hover · exit · action click)다. 바탕은 visible.
# kind 는 아이콘 stroke 색만 가른다. 상태 표(#matrix)가 kind 와 상관없는 공통 값만 보이도록
# kind 에는 기본값을 두지 않는다.

name: Sonner

slots:
  root: 토스트 상자(container) — 면 · 그림자 · 모양, 아이콘 · 글 묶음 · 버튼을 감싼다
  icon: 좌측 kind 아이콘(stroke svg)
  content: 제목 · 설명 묶음
  action: 액션 버튼(button sm) — 선택
  stack: 여러 토스트 묶음(`<Toaster />`)

variants:
  kind:
    default: '중립 알림 — 일반 정보 toast, action 동반 알림(예: "보관함으로 이동했습니다 — 되돌리기").'
    success: 성공 / 완료 — 저장 성공, 결재 승인 완료.
    error: 실패 / 에러 — 저장 실패, 네트워크 끊김.
    warning: 주의 / 임박 — 저장 공간 부족, 기한 임박 D-3.
    info: 정보 / 안내 — 새 알림 도착, 백그라운드 동기화 완료.

states:
  visible: 표시 상태 (auto-dismiss timer 진행) — spec 그대로
  enter: 화면 모서리에서 슬라이드 + fade in
  hover: timer 일시정지 + 가까운 토스트 stack 펼침
  exit: swipe 또는 timer 만료 시 fade out
  action click: callback 실행 + 즉시 dismiss (callback 결과는 별도 toast로 안내)

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    visible:
      root:
        minHeight: { value: 52px, note: "literal" }
        paddingY: $spacing-md
        paddingX: $spacing-lg
        radius: $radius-md
        shadow: $shadow-md
        borderColor: { value: none, note: "면 + 그림자로 분리" }
        maxWidth: { value: 360px, note: "literal — sonner 라이브러리 기본" }
        columnGap: { value: $spacing-md, note: "icon · content · action" }
        rowGap: { value: $spacing-md, note: "글 줄 · 버튼 줄 — 가로 gap 과 같은 값(한 `gap`)" }
      action:
        marginLeft: { value: auto, note: "버튼 자리 — 글 아래 줄 오른쪽 끝" }
      content:
        gap: { value: $spacing-xs, note: "title · description" }
      icon:
        size: { value: 20px, note: "20×20 (svg width/height)" }
      stack:
        gap: { value: $spacing-md, note: "multi-toast" }
    enter:
      root:
        # 옮기기 전 표는 250ms 라 적었다. 토큰은 200ms — 값은 고치지 않았다.
        transitionDuration: { value: $motion-duration-base, note: "옮기기 전 표기 250ms — 토큰 값과 다르다" }
        transitionEasing: $motion-ease-out
    hover:
      root:
        shadow: { value: $shadow-md, note: "변화 없음" }
    exit:
      root:
        transitionDuration: $motion-duration-base
        # DESIGN.md 에 motion-ease-in 토큰이 없다(easing 은 ease-out 단독) — 원래 표기 그대로.
        transitionEasing: motion-ease-in

  # ── 종류별 아이콘 색 ──────────────────────────────────
  # 옮기기 전 표의 hex 는 지금 토큰 값과 다르다 — 값은 고치지 않고 note 에 남긴다.
  - when: { kind: default }
    visible:
      icon:
        stroke: { value: none, note: "icon 없음" }

  - when: { kind: success }
    visible:
      icon:
        stroke: { value: $color-success, note: "옮기기 전 표기 #1A7F47 — 토큰 값과 다르다" }

  - when: { kind: error }
    visible:
      icon:
        stroke: { value: $color-error, note: "옮기기 전 표기 #D32F2F — 토큰 값과 다르다" }

  - when: { kind: warning }
    visible:
      icon:
        stroke: { value: $color-warning, note: "옮기기 전 표기 #F59E0B — 토큰 값과 다르다" }

  - when: { kind: info }
    visible:
      icon:
        stroke: { value: $color-info, note: "옮기기 전 표기 #2271D1 — 토큰 값과 다르다" }
