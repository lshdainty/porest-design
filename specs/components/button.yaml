# Button 의 수치 원본.
#
# button.md 의 수치 표 자리에는 이 파일을 가리키는 줄(`[표: …](button.yaml#…)`)만 있고,
# 사이트는 빌드 때 이 파일로 표를 그린다(site/scripts/spec-tables.mjs). 수치를 고치려면 여기를 고친다.
# 다른 컴포넌트의 YAML 도 이 형식을 따른다.
#
# 값
#   `$이름`        DESIGN.md 토큰 — CSS 변수 이름에서 `--` 를 뗀 것(`$spacing-lg` = `--spacing-lg`).
#   `$이름 / 12%`  그 색을 12% 불투명도로.
#   그 밖          단위를 붙여 그대로(`9px`, `0.98`, `none`, `min(90%, 420px)`).
#   { value, dark, note }  다크 모드 값이 따로 있거나 비고를 붙일 때. dark 가 없으면 토큰의
#                  `-dark` 짝을 쓰고, 짝도 없으면 라이트 값 그대로다.
# 축 · 상태
#   목록([a, b]) 또는 설명을 단 맵({ a: 설명, b: 설명 }). 설명은 표의 '설명' 칸에 나온다.
#   enabled 가 바탕이다. 다른 상태에는 enabled 에서 바뀌는 값만 적는다.
# 규칙
#   when 에 적은 변형이 모두 맞는 조합에 적용된다. when 이 비면 모든 조합.
#   뒤에 나온 규칙이 앞의 같은 값을 덮는다.
# 표 구역(md 의 `#…`)
#   base · slots · <축> · grid.<축>[.<축>.<값>…] · states.<축> · matrix[.<축>.<값>…] · compound · motion
#   — 설명은 site/scripts/spec-tables.mjs 의 renderSection.

name: Button

slots:
  root: 버튼 상자 — 배경 · 테두리 · 그림자 · 모양, 글자·아이콘 색(currentColor)
  label: 글자
  icon: 아이콘 글리프
  focusRing: 키보드 포커스 링

variants:
  variant: [default, destructive, outline, secondary, dangerSoft, ghost, accent, link]
  size: [sm, default, md, lg, icon, iconLg]

# size 는 기본값을 두지 않는다 — desk 웹은 default, recipe 는 md 가 cva 기본값이다.
# 크기는 이름이 아니라 높이로 고른다(button.md Migration notes 2026-09-16).
defaults:
  variant: default

states: [enabled, hovered, focused, pressed, disabled]

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      root:
        gap: $spacing-sm
        cursor: pointer
        brightness: 100%
        scale: 1
        transitionProperty: box-shadow
        transitionDuration: $motion-duration-fast
        transitionEasing: $motion-ease-out
      label:
        fontFamily: $font-sans
        fontWeight: 500
        lineHeight: 1
    focused:
      focusRing:
        width: 2px
        offset: 2px
        color: { value: $color-border-focus, dark: $color-border-focus-light }
    disabled:
      root:
        opacity: 0.5
        cursor: not-allowed

  # ── 변형별 색 ─────────────────────────────────────────
  - when: { variant: default }
    enabled:
      root: { background: $color-info, foreground: $color-text-on-accent, shadow: $shadow-sm }
    hovered:
      root: { brightness: 105%, shadow: $shadow-md }
    pressed:
      root: { brightness: 95%, scale: 0.98, shadow: none }

  - when: { variant: destructive }
    enabled:
      root: { background: $color-error, foreground: $color-text-on-accent, shadow: $shadow-sm }
    hovered:
      root: { brightness: 105%, shadow: $shadow-md }
    pressed:
      root: { brightness: 95%, scale: 0.98, shadow: none }

  - when: { variant: outline }
    enabled:
      root: { background: transparent, foreground: $color-text-primary, borderColor: $color-border-default, borderWidth: 1px }
    hovered:
      root: { background: $color-surface-input, borderColor: $color-border-strong }
    pressed:
      root: { background: $color-border-default, scale: 0.98 }

  - when: { variant: secondary }
    enabled:
      root: { background: $color-surface-input, foreground: $color-text-primary }
    hovered:
      root: { background: $color-border-default }
    pressed:
      root: { brightness: 95%, scale: 0.98 }

  # 다크 값은 스펙이 가리키는 --status-danger-subtle · --status-danger-fg 의 정의(desk-front index.css)
  - when: { variant: dangerSoft }
    enabled:
      root:
        background: { value: $color-error / 12%, dark: $color-error / 18%, note: "desk 별칭 --status-danger-subtle" }
        foreground: { value: $color-error, dark: $color-error-light, note: "desk 별칭 --status-danger-fg" }
    hovered:
      root: { background: $color-error / 18% }
    pressed:
      root: { brightness: 95%, scale: 0.98 }

  - when: { variant: ghost }
    enabled:
      root: { background: transparent, foreground: $color-text-primary }
    hovered:
      root: { background: $color-surface-input }
    pressed:
      root: { background: $color-border-default, scale: 0.98 }

  - when: { variant: accent }
    enabled:
      root: { background: transparent, foreground: $color-primary }
    hovered:
      root: { background: $color-surface-input }
    pressed:
      root: { background: $color-border-default, scale: 0.98 }

  - when: { variant: link }
    enabled:
      root: { background: transparent, foreground: $color-primary }
    hovered:
      label: { textDecoration: underline }
    pressed:
      root: { brightness: 90% }

  # ── 크기 ──────────────────────────────────────────────
  - when: { size: sm }
    enabled:
      root: { height: 32px, paddingY: $spacing-xs, paddingX: $spacing-sm, radius: $radius-sm }
      label: { typography: $text-caption }
      icon: { size: 14px }

  - when: { size: default }
    enabled:
      root: { height: 36px, paddingY: 9px, paddingX: $spacing-lg, radius: $radius-sm }
      label: { typography: $text-body-sm }
      icon: { size: 16px }

  - when: { size: md }
    enabled:
      root: { height: 40px, paddingY: $spacing-sm, paddingX: $spacing-md, radius: $radius-sm }
      label: { typography: $text-body-md }
      icon: { size: 16px }

  - when: { size: lg }
    enabled:
      root: { height: 48px, paddingY: $spacing-md, paddingX: $spacing-lg, radius: $radius-md }
      label: { typography: $text-title-sm }
      icon: { size: 18px }

  - when: { size: icon }
    enabled:
      root: { height: 40px, width: 40px, paddingY: 0, paddingX: 0, radius: $radius-md }
      icon: { size: 16px }

  - when: { size: iconLg }
    enabled:
      root: { height: 36px, width: 36px, paddingY: 0, paddingX: 0, radius: $radius-full }
      icon: { size: 20px }

  # ── 조합 ──────────────────────────────────────────────
  # 아이콘 액션(리스트 행·툴바의 보조 아이콘)은 보조톤으로 약화한다. iconLg 는 약화하지 않는다.
  - when: { variant: ghost, size: icon }
    enabled:
      root: { foreground: $color-text-secondary }
