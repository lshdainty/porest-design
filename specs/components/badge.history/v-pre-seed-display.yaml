# Badge 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 변형은 style 마다 표가 따로 있어(badge.md Variants) 축도 style 마다 하나씩 둔다 — solid · soft · outline 축의
# 값이 그 style 의 variant 이름이다. hover 는 style 마다 달라 style 축 규칙에 있다.
# 세 축과 style 은 서로 곱해지지 않는다(한 badge 는 한 style 의 variant 하나).
# defaults 를 두면 공통 상태 표(#matrix)에 변형 색이 모든 행의 칸으로 끼어든다 — 기본값은 축 값 설명에 적는다.

name: Badge

slots:
  root: pill — 배경 · 테두리 · 글자, 안쪽 여백
  dot: dot indicator(선택) — outline 에 색 의미를 더할 때
  focusRing: 키보드 포커스 링(interactive badge 만)

variants:
  style: [solid, soft, outline]
  solid:
    default: (default) brand 강조 라벨 — "NEW", "BETA", primary 강조 상태("승인").
    secondary: neutral 라벨 — 카테고리 태그, 우선순위 평이.
    destructive: 위험·거절 강조 — "반려", "삭제 예정". semantic error의 강조 톤.
  soft:
    info: 정보성 라벨 — "신규", "안내".
    success: 성공·완료 — "완료", "정상".
    warning: 주의·임박 — "경고", "임박".
    error: 약한 오류 강조 — "실패", "지연". (강한 destructive는 solid `destructive` 사용.)
  outline:
    outline: neutral outline — 정보 강도 가장 낮은 라벨, dot indicator와 조합. shadcn 기본 `outline`.
    outline-info: '"LOW" 같은 약한 정보 — 첫 화면 LOW 패턴.'
    outline-success: '"OK" 같은 약한 긍정.'
    outline-warning: '"MEDIUM" 같은 중간 경고 — 첫 화면 MEDIUM 패턴.'
    outline-error: '"HIGH" 같은 강한 경고 — 첫 화면 HIGH 패턴.'

states:
  default: (static) — 배경 · 테두리 · 글자는 variant 색
  hover: (interactive only) — clickable badge만 (filter chip 등)
  focus-visible: (interactive only)
  disabled: ""

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    default:
      root:
        paddingY: { value: 2px, note: "`py-0.5` (Tailwind shortcut)" }
        paddingX: $spacing-sm
        radius: { value: $radius-full, note: pill }
        borderWidth: { value: 1px, note: "(outline·default), 0 (solid·soft)" }
        typography: $text-badge
        letterSpacing: { value: 0, note: "base — uppercase opt-in 은 0.04em (literal)" }
        minHeight: { value: ≈ 18px, note: 텍스트 + padding-y — 자동 }
      dot:
        size: 6px
        gap: { value: $spacing-xs, note: "dot ↔ text — `mr-1.5` 또는 `var(--spacing-xs)`" }
    focus-visible:
      focusRing:
        width: 2px
        offset: 2px
        color: { value: $color-border-focus, note: "`ring-2 ring-ring ring-offset-2` — ring = border-focus(shadcn bridge)" }
    disabled:
      root:
        opacity: 0.5
        cursor: { value: not-allowed, note: "`cursor-not-allowed` — interactive badge만" }
        pointerEvents: { value: none, note: "`pointer-events-none` — interactive badge만" }

  # ── style 별 hover ────────────────────────────────────
  - when: { style: solid }
    hover:
      root:
        brightness: { value: 105%, note: "`brightness-105`" }

  - when: { style: soft }
    hover:
      root:
        background: { value: "bg-*-weak-pressed", note: "soft 색마다 — info → `$color-bg-informative-weak-pressed` 식(v102 역할 색)" }

  - when: { style: outline }
    hover:
      root:
        background: $color-surface-input

  # ── solid ─────────────────────────────────────────────
  - when: { solid: default }
    default:
      root: { background: $color-primary, foreground: $color-text-on-accent }

  - when: { solid: secondary }
    default:
      root: { background: $color-surface-input, foreground: $color-text-primary }

  - when: { solid: destructive }
    default:
      root: { background: $color-error, foreground: $color-text-on-accent }

  # ── soft ──────────────────────────────────────────────
  - when: { soft: info }
    default:
      root:
        background: $color-bg-informative-weak
        foreground: $color-fg-informative-contrast

  - when: { soft: success }
    default:
      root:
        background: $color-bg-positive-weak
        foreground: $color-fg-positive-contrast

  - when: { soft: warning }
    default:
      root:
        background: $color-bg-warning-weak
        foreground: $color-fg-warning-contrast

  - when: { soft: error }
    default:
      root:
        background: $color-bg-critical-weak
        foreground: $color-fg-critical-contrast

  # ── outline ───────────────────────────────────────────
  - when: { outline: outline }
    default:
      root: { borderColor: $color-border-default, foreground: $color-text-primary }

  - when: { outline: outline-info }
    default:
      root: { borderColor: $color-info, foreground: $color-info }

  - when: { outline: outline-success }
    default:
      root: { borderColor: $color-success, foreground: $color-success }

  - when: { outline: outline-warning }
    default:
      root: { borderColor: $color-warning, foreground: $color-warning }

  - when: { outline: outline-error }
    default:
      root: { borderColor: $color-error, foreground: $color-error }

motion:
  colors:
    duration: $motion-duration-fast
    easing: $motion-ease-out
    properties: [colors]
    note: "`transition-colors`"
