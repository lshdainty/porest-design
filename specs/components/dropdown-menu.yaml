# Dropdown Menu 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 크기 표(container · item · separator · shortcut)는 조건 없는 규칙의 enabled 에 있다(#base.enabled).
# destructive 는 enabled · hover 와 곱해지므로 상태가 아니라 축이다. md 가 "variant 없음 — item
# kind(default/destructive)" 라 부르므로 축 이름은 kind(dropdown-menu.tsx 에서는 item 의 `variant` prop).
# item 색은 kind 규칙에만 둔다 — 조건 없는 규칙에 두면 크기 표에 섞인다.
# 상태 표는 destructive 의 pressed · disabled 를 적지 않았다. 그래서 #matrix.kind.destructive
# 대신 #grid.kind(enabled) + #states.kind(바뀌는 값)로 그린다 — 적지 않은 줄을 지어내지 않는다.

name: Dropdown Menu

slots:
  root: ⓐ container(content)
  item: ⓓ item — 아이콘 + 글자 + (선택) shortcut
  insetItem: inset · checkbox · radio item — 왼쪽 indicator 영역
  separator: ⓒ separator
  shortcut: ⓖ shortcut — 우측 정렬

variants:
  kind: [default, destructive]

defaults:
  kind: default

states:
  enabled: ""
  hover: / focus — focus-visible는 hover와 동일 시각
  pressed: ""
  disabled: ""

rules:
  # ── 크기(Sizes) ───────────────────────────────────────
  - when: {}
    enabled:
      root:
        padding: $spacing-xs
        radius: $radius-md
        shadow: { value: $shadow-md, note: inline }
        borderWidth: 1px
        borderStyle: solid
        borderColor: $color-border-default
        minWidth: 160px
        sideOffset: { value: 4px, note: "trigger ↔ content — Radix 기본" }
        zIndex: { value: 200, note: "L3 modal-aware floating — [`z-index.md`](../z-index.md)" }
      item:
        paddingY: $spacing-sm
        paddingX: $spacing-md
        radius: $radius-sm
        typography: $text-body-md
        gap: { value: $spacing-sm, note: icon-text }
      insetItem:
        paddingLeft: { value: $spacing-xl, note: checkbox/radio indicator 영역 }
      separator:
        margin: { value: $spacing-xs, note: Y }
      shortcut:
        typography: $text-label-sm

  # ── kind 별 item 색 · 상태 ────────────────────────────
  - when: { kind: default }
    enabled:
      item:
        background: transparent
        foreground: $color-text-primary
    hover:
      item:
        background: $color-surface-input
    pressed:
      item:
        background: { value: $color-surface-input, note: 즉시 dismiss }
    disabled:
      item:
        opacity: 0.5
        pointerEvents: none

  - when: { kind: destructive }
    enabled:
      item:
        background: transparent
        foreground: $color-error
    hover:
      item:
        background: $color-error / 12%
