# Dialog 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 크기로 갈리는 건 폭 하나뿐이지만, 크기 표가 여백 · 간격 · 모서리를 크기마다 적어 두었으므로
# 그대로 크기 규칙에 둔다. container(root) 의 여백은 0 이고 여백은 header · body · footer 가
# 각자 갖는다(조건 없는 규칙). 열림 · 닫힘 상태 표(미렌더 · 스크롤 잠금 · 포커스)는 동작이라
# dialog.md 에 남는다 — 여기 값은 모두 열린 dialog 의 값이다.

name: Dialog

slots:
  root: ⓑ container — 표면 · 모양 · 폭
  header: title + 우상단 close
  body: 자유 영역 — 스크롤은 여기서만
  footer: 액션

variants:
  size:
    sm: 짧은 확인 (1–2줄 description, button 2개) — preview의 mini dialog 톤.
    md: 일반 form, 정보 확인 — preview `renderModal` 톤.
    lg: 다단계 form, 복잡한 콘텐츠 편집 (메모/가계부 detail 등).

defaults:
  size: md

states: [open]

rules:
  # ── 구역별 여백(Layout) ────────────────────────────────
  - when: {}
    open:
      header:
        padding: { value: 18px 22px, note: "title + 우상단 close. `flex items-center gap-3`, `flex-shrink:0`" }
      body:
        padding: { value: 22px, note: "`flex:1; min-height:0; overflow-y:auto` — 스크롤은 여기서만" }
      footer:
        padding: { value: 18px 22px, note: "`flex items-center gap-2`, `flex-shrink:0`" }

  # ── 크기 ──────────────────────────────────────────────
  - when: { size: sm }
    open:
      root:
        maxWidth: 420px
        padding: { value: 0, note: 구역별 }
        gap: 0
        radius: $radius-lg

  - when: { size: md }
    open:
      root:
        maxWidth: 520px
        padding: { value: 0, note: 구역별 }
        gap: 0
        radius: $radius-lg

  - when: { size: lg }
    open:
      root:
        maxWidth: 720px
        padding: { value: 0, note: 구역별 }
        gap: 0
        radius: $radius-lg

motion:
  "open: overlay":
    duration: $motion-duration-base
    easing: $motion-ease-out
    properties: [opacity 0 → 1]
  "open: container":
    duration: $motion-duration-slow
    easing: $motion-ease-out
    properties: [scale 0.96 → 1, opacity 0 → 1]
  "close: container":
    duration: $motion-duration-base
    easing: $motion-ease-out
    properties: [scale 1 → 0.96, opacity 1 → 0]
  "close: overlay":
    duration: $motion-duration-base
    easing: $motion-ease-out
    properties: [opacity 1 → 0]
