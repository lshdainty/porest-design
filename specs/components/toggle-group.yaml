# Toggle Group 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 켬 · 끔(pressed)은 hover · focus-visible · disabled 와 곱해지므로 상태가 아니라 축이다.
# off 모양은 두 visual 이 같다({ pressed: off }), on 모양과 hover 는 visual 마다 다르다({ visual, pressed }).
# size 에는 기본값을 두지 않는다 — 상태 표(#matrix.visual.….pressed.…)에 크기 칸이 끼지 않도록.
# default 가 기본 크기다(설명 칸). 글자 · 아이콘은 모든 크기에서 같아 공통 규칙에 둔다.

name: Toggle Group

slots:
  item: ⓑ item — Toggle BASE 상속 + `rounded-none border-0`(outer border 가 형태 결정)
  icon: item 아이콘(선택)
  focusRing: 키보드 포커스 링

variants:
  visual:
    subtle: 토스 톤 절제 — dialog footer · 인접 정보 위계에 묻히지 않게 절제할 때. group 형태 자체로 의미 전달.
    solid: cobalt brand 채움으로 강조(shadow 없음) — form type 선택, 모드 전환 같이 ‟현재 선택‟ 을 명확히 부각해야 할 때.
  size:
    sm: ""
    default: 기본
    lg: ""
  pressed:
    off: ""
    on: (`data-state=on`)

defaults:
  visual: subtle

states: [enabled, hover, focus-visible, disabled]

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      item:
        typography: $text-caption
        fontWeight: 600
      icon:
        size: 16px
    focus-visible:
      focusRing:
        width: 2px
        offset: 2px
        color: { value: $color-border-focus, note: "`ring-2 ring-ring ring-offset-2` (inset) — ring = border-focus(shadcn bridge)" }
    disabled:
      item:
        opacity: 0.5
        pointerEvents: { value: none, note: "`pointer-events: none`" }

  # ── 크기 ──────────────────────────────────────────────
  - when: { size: sm }
    enabled:
      item: { paddingY: $spacing-xs, paddingX: $spacing-sm, minHeight: 28px }

  - when: { size: default }
    enabled:
      item: { paddingY: $spacing-xs, paddingX: $spacing-md, minHeight: 32px }

  - when: { size: lg }
    enabled:
      item: { paddingY: $spacing-sm, paddingX: $spacing-lg, minHeight: 40px }

  # ── off ───────────────────────────────────────────────
  - when: { pressed: off }
    enabled:
      item:
        background: transparent
        foreground: $color-text-secondary

  - when: { visual: subtle, pressed: off }
    hover:
      item:
        background: $color-surface-input
        foreground: $color-text-primary

  - when: { visual: solid, pressed: off }
    hover:
      item:
        background: { value: transparent, note: "hover 분리 안 함 — solid 톤은 selected 만 강조" }

  # ── on ────────────────────────────────────────────────
  - when: { visual: subtle, pressed: on }
    enabled:
      item:
        background: $color-surface-input
        foreground: $color-text-primary
        fontWeight: 600

  - when: { visual: solid, pressed: on }
    enabled:
      item:
        background: $color-primary
        foreground: $color-text-on-accent
        fontWeight: 600
        shadow: none
